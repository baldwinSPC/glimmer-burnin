name: Bug report
description: Something the operator or a runner did that it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **If a verdict is wrong, that is the most valuable kind of bug here** —
        this operator's output is what admits hardware to a fleet. Attach the
        runner's stdout and the `TestResult`; the two together are what the
        verdict was derived from.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the operator did, and what you expected instead.
    validations: {required: true}

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The BurnInTest / BurnInProfile / BurnInRun, minimised if you can. Redact
        node names if you need to, but keep the shape — a Pair or Group test
        behaves differently from a Node one.
      render: yaml
    validations: {required: true}

  - type: input
    id: operator-version
    attributes:
      label: Operator version
      description: The image tag the manager Deployment is running.
      placeholder: "v0.5.0"
    validations: {required: true}

  - type: input
    id: runner-image
    attributes:
      label: Runner image and tag
      description: >-
        The exact tag. Published tags are immutable, so this identifies precisely
        what executed — "latest" is not an answer.
      placeholder: "ghcr.io/baldwinspc/glimmer-burnin-thermal-soak:v0.5.0"

  - type: textarea
    id: status
    attributes:
      label: The run's status
      description: >-
        `kubectl get burninrun <name> -o yaml`. The `status.results` entry
        matters most: its phase, message, violations and metrics.
      render: yaml

  - type: textarea
    id: runner-output
    attributes:
      label: The runner's own output
      description: >-
        `kubectl logs <pod>`. A container log merges stdout and stderr, which is
        usually what makes a verdict explicable — paste it whole rather than the
        line you think is relevant.
      render: shell

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: >-
        Accelerator model, driver version, and the fabric if a link test is
        involved. `NodeFingerprint` has all of it if you have one.

  - type: checkboxes
    id: not-security
    attributes:
      label: Confirm
      options:
        - label: >-
            This is not a security vulnerability. (If it is, close this and use
            private reporting — see SECURITY.md.)
          required: true
