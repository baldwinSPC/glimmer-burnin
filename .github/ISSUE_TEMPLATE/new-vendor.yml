name: Propose support for a new vendor
description: An accelerator vendor this project does not yet measure
labels: [enhancement, new-vendor]
body:
  - type: markdown
    attributes:
      value: >-
        **Vendor neutrality lives in the reconciler.** Adding support for a
        vendor should mean adding RUNNERS, not adding an `if nvidia {}`. These
        questions establish whether that is possible for this vendor, and what it
        costs.

  - type: input
    id: vendor
    attributes:
      label: Vendor and parts
      placeholder: "AMD — MI300X, MI325X"
    validations: {required: true}

  - type: textarea
    id: telemetry
    attributes:
      label: What is the telemetry interface?
      description: >-
        The equivalent of NVML: what library or sysfs surface reports
        temperature, clocks, ECC, and link state, and what does it need present
        on the host. Name the package and whether it is redistributable.
    validations: {required: true}

  - type: textarea
    id: existing-kinds
    attributes:
      label: Which existing TestKinds can this vendor satisfy?
      description: >-
        Several kinds are vendor-NEUTRAL in name and have NVIDIA-only images
        today (`nccl`, `memory-bw`). For each kind you intend to cover, say
        whether it is a new image for the same kind, or a genuinely different
        measurement that needs its own kind.
      value: |
        | kind | new image for this kind, or a new kind? | notes |
        |---|---|---|
        |  |  |  |
    validations: {required: true}

  - type: textarea
    id: metric-equivalence
    attributes:
      label: Do the metrics MEAN the same thing?
      description: >-
        This is the question that decides whether a shared threshold is
        meaningful. If this vendor's "ECC errors" counts something different from
        NVML's, a profile written for one fleet silently means something else on
        the other — and the operator would be comparing numbers that are not
        comparable. Where they differ, they need different names.
    validations: {required: true}

  - type: textarea
    id: node-labels
    attributes:
      label: How is a node of this vendor identified?
      description: >-
        The label or resource a device plugin sets, so a profile can select these
        nodes and a plan can choose the right image without the reconciler
        knowing the vendor's name.
    validations: {required: true}

  - type: textarea
    id: licence
    attributes:
      label: Licences of everything that would be vendored or installed
      description: >-
        Blocking. Permissive only. Runner images additionally ship no
        vendor-licensed redistributable libraries — the CUDA toolchain is used
        at build time only and the Dockerfile fails the build if `ldd` finds one
        in the final binary. State the equivalent constraint for this vendor.
    validations: {required: true}

  - type: textarea
    id: hardware-access
    attributes:
      label: Is there hardware to verify against?
      description: >-
        And who has access to it. A runner that has never run on the part it
        claims to measure cannot be published.
    validations: {required: true}
