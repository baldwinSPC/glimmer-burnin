blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/baldwinSPC/glimmer-burnin/security/advisories/new
    about: >-
      Private vulnerability reporting. Do NOT open a public issue for a security
      problem — this operator can cordon nodes and runs semi-trusted images on
      production hardware.
  - name: Ask a question
    url: https://github.com/baldwinSPC/glimmer-burnin/discussions
    about: How do I use this, will it work on my fleet, what does this verdict mean.
