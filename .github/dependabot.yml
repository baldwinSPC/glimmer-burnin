version: 2

# What this covers, and — more importantly — what it does not.
#
# Dependabot can see two kinds of pin in this repository: the Go modules in
# go.mod, and the `uses:` references in .github/workflows. It CANNOT see the
# thing most likely to change a runner's behaviour: the upstream sources the
# runner images build from (CUTLASS, DCGM, nvbandwidth, perftest, NCCL,
# stressapptest) are fetched by `git clone -b "${X_REF}"` from an ARG in a
# Dockerfile, and Dependabot's docker ecosystem only understands literal FROM
# lines. Nor can it see the base images, which are ARGs for the same reason.
#
# Those are bumped BY HAND, deliberately, and runners/pins_test.go is what makes
# that safe: every <UPSTREAM>_REF must carry an <UPSTREAM>_SHA that the build
# asserts, so a bump is a two-line change a reviewer can check, and a moved
# upstream tag fails the build instead of silently changing what a fleet is
# measured by. Resolve a new commit with:
#
#   git ls-remote <repo> 'refs/tags/<ref>' 'refs/tags/<ref>^{}'
#
# taking the peeled (^{}) value for an annotated tag, since that is what a
# shallow clone leaves at HEAD.
#
# Licensing rule (CLAUDE.md): every update opened here still has to have its
# licence verified before merge. Permissive only — Apache-2.0, MIT, BSD-2/3 —
# and never a copyleft dependency, which would make this project unpublishable.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Kubernetes libraries move as a set; taking them one at a time produces
      # PRs that cannot build against each other.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
