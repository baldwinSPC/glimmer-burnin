name: Propose a new TestKind (runner)
description: A new acceptance test, and the image that performs it
labels: [enhancement, new-runner]
body:
  - type: markdown
    attributes:
      value: >-
        **These questions are the work order.** Every one of them has to be
        answered before a runner can be written, and answering them here means
        they are answered once, in public, instead of being reconstructed from a
        review thread later. If you do not know an answer, say so — "unknown" is
        a useful answer and a guess is not.

  - type: input
    id: kind
    attributes:
      label: Proposed TestKind
      description: The constant, in Go's spelling.
      placeholder: "KindPCIeBandwidth"
    validations: {required: true}

  - type: textarea
    id: claim
    attributes:
      label: What does a PASS actually claim about the hardware?
      description: >-
        One sentence, about the part. "The test succeeded" is not a claim.
        "Every lane of the x16 link sustained at least N GB/s in both directions
        for the full window" is.
    validations: {required: true}

  - type: textarea
    id: fail-vs-error
    attributes:
      label: What distinguishes a FAIL from an ERROR here?
      description: >-
        This is the question this project cares about most, and the one runners
        get wrong. Exit 1 is a HARDWARE VERDICT — the operator never retries it,
        so it permanently indicts a node with the retry budget unspent. It
        belongs only to something the run actually measured about the part.
        Everything that stopped the measurement from happening (no device
        visible, no kernel for this part, a driver error, a failure to set up the
        comparison) is exit 3.


        List the conditions on each side.
    validations: {required: true}

  - type: textarea
    id: skip
    attributes:
      label: When does this test not apply, and how does the runner say so?
      description: >-
        Exit 2 is honoured as Skip ONLY when stdout also carries an upper-case
        marker ending in `_SKIP` at the start of a line — because an unrecovered
        Go panic also exits 2, and "no metrics" is the normal shape of a skip.
        Give the marker you intend to print. If the test always applies, say
        that instead.
      placeholder: "PCIE_BW_SKIP: this part exposes no PCIe root complex to measure"
    validations: {required: true}

  - type: textarea
    id: metrics
    attributes:
      label: Metrics
      description: |
        For each: the canonical name, what it measures, its unit, and how it
        COMBINES if the test runs in segments (Sum / Min / Max / Last).

        Names are a contract: lowerCamelCase, and a dimensional metric ends in a
        registered unit suffix (Gbps, GBs, MBs, Us, Ms, S, C, W, Pct, Tflops,
        MHz). A dimensionless counter does not.

        Aggregation is the rule that is wrong in a way nothing else catches:
        a LIFETIME counter (an NVML aggregate since reset) is `Last`, and summing
        it multiplies it by the number of windows. A WINDOWED count is `Sum`. A
        floor is `Min` because the worst window describes the part.
      value: |
        | name | measures | unit | aggregation | thresholdable? |
        |---|---|---|---|---|
        |  |  |  |  |  |
    validations: {required: true}

  - type: textarea
    id: unmeasurable
    attributes:
      label: Can any metric be genuinely unmeasurable on some supported part?
      description: >-
        If a runner can look and find nothing to measure, it emits the reserved
        value `n/a` for that key — a positive declaration about the part, which
        lets a `RequiredIfMeasurable` threshold be reported as not-evaluated
        instead of failing a healthy node. GB10 exposing no ECC to NVML is the
        worked example.


        It may only declare what it positively established. "We could not look"
        stays an omission.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - "Node — one pod, one node"
        - "Pair — two pods, a verdict about the LINK"
        - "Group — N ranks, one verdict about the COLLECTIVE"
    validations: {required: true}

  - type: dropdown
    id: duration
    attributes:
      label: Does it honour BURNIN_DURATION_SECONDS?
      description: >-
        If not, the kind must declare itself burst-only — `runners/pins_test.go`
        refuses a non-burst kind whose source never reads the variable, and a
        burst kind whose source does.
      options:
        - "Yes — it runs for the requested duration"
        - "No — it is burst-only (finishes in milliseconds however long it is asked for)"
    validations: {required: true}

  - type: textarea
    id: upstream
    attributes:
      label: Upstream dependencies, and their licences
      description: >-
        Every upstream is pinned to a COMMIT and the Dockerfile asserts it, so
        give the repo, the tag, and the peeled SHA if you have it. **Licence is
        blocking**: permissive only. If an upstream is dual-licensed, say which
        option we consume it under — `linux-rdma/perftest` is GPL/BSD dual and
        must be taken under BSD.
    validations: {required: true}

  - type: textarea
    id: host-access
    attributes:
      label: What host access does it need?
      description: >-
        `spec.runner.hostPaths` is the only route to the node's filesystem, and a
        test that declares nothing gets a pod with no volumes at all. Name each
        path and why. Note that `privileged: true` is NOT a substitute — measured
        on this project's own nodes, a privileged hostNetwork pod was missing
        every `/dev/infiniband/uverbs*` device the host had.

  - type: textarea
    id: degradation
    attributes:
      label: How does it behave with its mount or device MISSING?
      description: >-
        It must degrade honestly. Without `/dev/kmsg`, host-health reports
        `xid_source=none` and OMITS `xidEvents` rather than printing a zero it
        never measured — so a gate on it fails the node instead of certifying it.
        A fabricated zero certifies a fleet nobody looked at, and that is not
        recoverable.
    validations: {required: true}

  - type: textarea
    id: arch
    attributes:
      label: Architectures
      description: >-
        CPU architecture and GPU architecture are ORTHOGONAL. Say both. An amd64
        image containing only `sm_121a` device code helps nobody, because CC 12.1
        is GB10 and there is no x86 host with one. Note that PTX only JITs
        UPWARD.

  - type: textarea
    id: verification
    attributes:
      label: How will this be verified on real hardware?
      description: >-
        Which part, and what result would count as the kernel working. A runner
        image is executed by a node's readiness gate, so publishing before the
        kernel has been verified degrades a whole fleet at once.
    validations: {required: true}
