name: Publish operator image

# The controller image, published deliberately and manually — the same posture as
# publish-runner.yml, for a weaker but real version of the same reason. A bad
# runner tag degrades a fleet one node at a time; a bad controller tag takes out
# the thing that cordons and uncordons them.
#
# This workflow exists because CI does not push. The `docker` job in ci.yml
# builds the image and throws it away ("no push on CI"), which is correct — a
# merge to main should not mint a release artifact — but it left no path that
# publishes at all. The consequence is already in the release history: v0.2.1 and
# v0.2.2 were tagged against config/manager/manager.yaml pinning an operator
# image that had never been pushed, so `kubectl apply -f config/manager` on those
# releases could only ever ImagePullBackOff.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish (e.g. v0.3.0). Must not already exist, and must match the tag config/manager/manager.yaml pins.'
        required: true
        type: string
      acknowledge_stale_pins:
        description: >-
          Publish even though a pinned runner image is older than its runner's
          source. Leave FALSE unless you have read the list the pins job prints
          and intend to ship it anyway — the release notes must then say which
          images lag. This is an affirmation, not a convenience.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  # KEYLESS SIGNING. cosign exchanges this token with Sigstore for a
  # short-lived certificate that binds the signature to THIS workflow, in THIS
  # repository, at THIS ref — so a consumer can verify not merely that a tag was
  # signed, but that it was signed by this CI and nothing else.
  #
  # There is no private key anywhere: nothing to leak, nothing to rotate,
  # nothing to lose. The identity IS the workflow.
  id-token: write

jobs:
  # ── pins: are the runner images this release pins built from this source? ────
  #
  # A release is the artifact whose whole claim is "these pins are what you get",
  # so it is the one moment that question is load-bearing — and until #509 it was
  # the one moment nothing asked it. hack/checkpins ran weekly and on dispatch
  # (see ci.yml, which explains why it is deliberately NOT a PR check: drift
  # accumulated since the last publish is not a fact any single PR caused, and
  # gating PRs on it would turn unrelated work red). Weekly is a fine cadence for
  # a sweep and a useless one for a release: the answer could be six days stale
  # at the moment it decided what a fleet pulls. #507 was found by hand instead,
  # while doing something else, which is word for word how #379 describes the
  # drift that motivated writing checkpins in the first place.
  #
  # IT BLOCKS, BUT IT CAN BE OVERRIDDEN OUT LOUD. A hard block would be wrong:
  # v0.9.0 shipped with eight known-stale pins deliberately, because republishing
  # a runner image without verifying its kernel on real hardware is the one thing
  # this project's history says never to do, and eight verifications is not one
  # session's work. So the escape hatch is an INPUT the publisher has to set,
  # which means the drift list is printed, read, and affirmed — and the
  # affirmation is recorded in the run's own inputs, where a later reader can
  # find it. Silence is not consent; the default is false.
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # checkpins diffs an arbitrarily old pinned commit against HEAD, which
          # a shallow clone cannot resolve. Same reason as ci.yml's copy.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Every pinned runner image matches its source
        env:
          ACK: ${{ inputs.acknowledge_stale_pins }}
        run: |
          set -uo pipefail
          if go run ./hack/checkpins; then
            echo "Every pinned runner image is built from the source in this tree." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${ACK}" = "true" ]; then
            {
              echo "### Publishing with STALE runner pins, acknowledged"
              echo
              echo "acknowledge_stale_pins was set, so this release ships pinned runner"
              echo "images that are older than their source. The release notes must say"
              echo "which ones — see the checkpins output in this job's log, and #509."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::warning::publishing with stale runner pins because acknowledge_stale_pins=true"
            exit 0
          fi
          {
            echo "### Refusing to publish: pinned runner images lag their source"
            echo
            echo "The images above were built from a commit older than the runner"
            echo "directory now in this tree, so a node pulling the default image would"
            echo "not get the behaviour this release describes."
            echo
            echo "Republish the affected runners (publish-runner.yml) and bump their"
            echo "pins, verifying each on real hardware first. If shipping the drift is"
            echo "the deliberate choice, re-run with acknowledge_stale_pins and say so"
            echo "in the release notes."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::pinned runner images lag their source; see the job summary"
          exit 1

  publish:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image reference
        # github.repository_owner preserves the account's mixed case
        # ("baldwinSPC"), but registry references must be lowercase or buildx
        # rejects the tag outright. Lowercase once, here, so the tag and the job
        # summary cannot drift apart.
        id: ref
        env:
          # Do NOT name any of these RUNNER_* or GITHUB_*: those prefixes are
          # reserved by Actions and a job-level env: cannot override them.
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="glimmer-burnin"
          image="ghcr.io/${OWNER,,}/${package}"
          if ! printf '%s' "${image}:${VERSION}" \
               | grep -qE '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9._-]+$'; then
            echo "::error::refusing to build malformed reference '${image}:${VERSION}'"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publishing ${image}:${VERSION}"

      - name: The manifest must already pin this tag
        # This is the guard that v0.2.1 and v0.2.2 needed and did not have.
        #
        # The deployment manifest is the artifact people actually apply, so the
        # image it names is the only one that matters to them. Requiring the
        # manifest to be bumped FIRST — in a reviewed PR, on main — means the tag
        # is never invented here: this workflow can only publish a version the
        # repository has already committed to. Publishing something the manifest
        # does not name would recreate the original failure with the arrow
        # pointing the other way.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest=config/manager/manager.yaml
          pinned=$(grep -oE 'ghcr\.io/[a-z0-9._-]+/glimmer-burnin:[A-Za-z0-9._-]+' "$manifest" \
                     | head -1 | sed 's/.*://')
          if [ -z "$pinned" ]; then
            echo "::error::could not find an operator image reference in $manifest"
            exit 1
          fi
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::$manifest pins '$pinned' but you asked to publish '$VERSION'."
            echo "Bump the image tag in $manifest on main first, then publish."
            exit 1
          fi
          echo "$manifest pins $pinned — matches"

      - name: Refuse to overwrite an existing tag
        # Published tags are immutable. Silently republishing one would change
        # what every existing deployment is running with no audit trail.
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.ref.outputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          # GITHUB_TOKEN is repo-scoped and may not be able to read user-level
          # packages. Distinguish "tag is absent" from "could not check": only
          # the former is safe to treat as a green light.
          if tags=$(gh api "user/packages/container/${PACKAGE}/versions" \
                      --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            if grep -qx "${VERSION}" <<<"${tags}"; then
              echo "::error::${PACKAGE}:${VERSION} already exists — pick a new version"
              exit 1
            fi
            echo "tag ${VERSION} is free"
          else
            echo "::warning::could not list existing tags for ${PACKAGE} (token may lack package read). Proceeding without the immutability check."
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (linux/amd64, linux/arm64)
        # Both platforms, because the operator is the one image EVERY adopter
        # runs regardless of what accelerators they have. A controller published
        # arm64-only locks an x86 fleet out of the project entirely, which is the
        # gap #86 closed for the runners.
        #
        # This is a small CGO-free Go binary on distroless, so the emulated half
        # costs little — unlike the runner images, it does not compile CUDA.
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=glimmer-burnin controller manager
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # The DIGEST, never the tag.
        #
        # Tags are immutable by policy here, and a signature over a tag would be
        # a signature over a mutable pointer — it would still verify after the
        # tag moved, which is exactly the situation a signature is supposed to
        # detect. The digest is the content, so the signature is about the bytes
        # a node actually pulls.
        #
        # For an operator whose images are executed by a node's readiness gate,
        # on hardware a site is deciding whether to accept, this is not
        # ceremony: it is the difference between "this came from this
        # repository's CI" and "this came from someone with push access to a
        # registry". Attestations get part of the way; a signature is what a
        # consumer can gate their own pulls on.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::the push step produced no digest; refusing to sign nothing"
            exit 1
          fi
          # The repository half of the tag, then the digest — an unambiguous
          # by-digest reference regardless of what the tag looks like.
          cosign sign --yes "${REF%%:*}@${DIGEST}"

      - name: Assert the published image carries a patched standard library
        # THE OPERATOR IS THE CASE THAT MATTERS MOST. internal/sink/webhook.go
        # imports net/http directly and dials a site-supplied BurnInSink URL, so
        # the standard library's URL parsing and TLS handshake are on a live path
        # taking externally-influenced input, inside the cluster.
        #
        # v0.6.0 shipped on go1.26.5 with 8 reachable vulnerabilities — including
        # http.Client.Do and net.LookupCNAME — and nothing in this workflow
        # looked (#309). Unlike the runners, whose flagged symbols are linked but
        # not driven, this one is genuinely exercised.
        #
        # NOTE THE OPERATOR'S FAILURE MODE IS NOT THE RUNNERS'. Its Dockerfile
        # says golang:1.26, which is the right BRANCH — and the official golang
        # images set GOTOOLCHAIN=local, so that tag decides the standard library
        # and go.mod's `toolchain` directive never reaches this build. CI asserts
        # the Dockerfile's major.minor equals go.mod's `go` directive, which is
        # the right granularity for a floating tag but cannot express "at least
        # the toolchain's patch". v0.6.0 was simply built while golang:1.26 still
        # resolved to 1.26.5; a rebuild today gets 1.26.6 and is clean, with no
        # pin to change. The runners were a different problem — golang:1.24, a
        # branch the advisories were never fixed on at all (#335).
        #
        # Which is exactly why a scan of the ARTEFACT is the right control here:
        # no pin check can catch "built before the patch existed".
        #
        # A CONFIRMATION, not a gate: there is no image to scan before it is
        # pushed. A failure means a bad tag already exists, and published tags are
        # immutable, so the answer is to supersede rather than repush. "Ships
        # known-vulnerable code" and "this step could not read the image" are kept
        # apart on every branch — a scanner that cannot find its binary must
        # report neither a clean image nor a dirty one.
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          if ! go run github.com/google/go-containerregistry/cmd/crane@v0.21.9 \
                 export "${REF}" - 2>"${workdir}/crane.err" | tar x -C "${workdir}" 2>/dev/null; then
            echo "::error::could not export ${REF} to scan it. This proves NOTHING about the image — do not supersede a tag over it. $(tail -1 "${workdir}/crane.err" || true)"
            exit 1
          fi

          entry="$(go run github.com/google/go-containerregistry/cmd/crane@v0.21.9 config "${REF}" \
                   | jq -r '.config.Entrypoint[0] // .config.Cmd[0] // empty')"
          if [ -z "${entry}" ] || [ ! -f "${workdir}${entry}" ]; then
            echo "::error::could not locate the entrypoint binary (${entry:-none}) inside ${REF}. NOT a verdict about the image."
            exit 1
          fi
          # Checked rather than echoed. The manager is always a Go binary, so
          # this is not the C++/CUDA case publish-runner has to handle (#386) —
          # but inside $( ) the failure is swallowed, the line prints "built
          # with:" and nothing, and the real complaint arrives from govulncheck
          # as "unrecognized binary format" several lines later. If the
          # entrypoint ever stops being a Go binary, say so here where it is
          # legible, and say it is not a verdict about the image.
          if ! go version -m "${workdir}${entry}" >/dev/null 2>&1; then
            echo "::error::${entry} in ${REF} is not a Go binary, so there is no Go build info to read. The operator is always Go, so this means the image or this step is wrong — NOT that the image ships vulnerable code."
            exit 1
          fi
          echo "${entry} was built with: $(go version -m "${workdir}${entry}" | head -1 | awk '{print $2}')"

          if go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -mode=binary "${workdir}${entry}"; then
            echo "no known vulnerabilities in the standard library ${REF} ships"
            exit 0
          fi
          echo "::error::${REF} SHIPS KNOWN-VULNERABLE CODE on a path this image drives — the sink webhook parses an operator-supplied URL and opens TLS to it. The tag is immutable, so supersede it rather than repushing: rebuild and publish a new tag, then move the manifest pin (#309)."
          exit 1

      - name: Report digest
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:  ${{ steps.ref.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "arch:   linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "signed: cosign keyless (see docs/verifying-images.md)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: a newly created GHCR package is PRIVATE. Set the package" >> "$GITHUB_STEP_SUMMARY"
          echo "visibility to Public before anyone tries to deploy this." >> "$GITHUB_STEP_SUMMARY"
