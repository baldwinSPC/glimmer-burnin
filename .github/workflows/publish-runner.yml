name: Publish runner image

# Publishing is deliberate and manual: a runner image is what a node's readiness
# gate executes, so a bad tag silently degrades a whole fleet. Trigger this only
# after the runner has been verified on real hardware.
#
# The options list must name every directory under runners/ that has a
# Dockerfile, or that runner cannot be published at all — and a default runner
# image entry in internal/controller/pods.go pointing at a tag no workflow can
# produce is an ImagePullBackOff with no way out.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Which runner to publish (a directory under runners/)'
        required: true
        default: compute-smoke
        type: choice
        options:
          - compute-smoke
          - clockprobe
          - dcgm-diag
          - host-health
          - memory-bw
          - memory-stress
          - thermal-soak
          - gpu-burn
          - ib-write-bw
          - nccl
          - gpudirect-rdma
          - tcp-baseline
          - disk-io
          - fingerprint-probe
      version:
        description: 'Image tag to publish (e.g. v0.1.0). Must not already exist.'
        required: true
        type: string
      cuda_arch:
        description: >-
          GPU gencode for the runners that compile device code (compute-smoke,
          nccl, memory-bw). This is the GPU axis and is INDEPENDENT of the host
          architecture: the image is always built for linux/amd64 AND
          linux/arm64. `default` uses each Dockerfile's PER-PLATFORM default
          (compute-smoke arm64 sm_121a / amd64 sm_120a; nccl arm64 sm_121 /
          amd64 sm_90) and is almost always what you want — an explicit value is
          applied to BOTH platforms, so sm_121a here produces an amd64 image
          full of GB10 code that no x86 host can run. Ignored by the CPU-only
          runners (host-health, memory-stress, ib-write-bw, tcp-baseline), by
          dcgm-diag, and
          by the soak family (clockprobe, thermal-soak, gpu-burn), whose
          Dockerfiles compile a fixed multi-gencode list instead.
        required: true
        default: default
        type: choice
        options: [default, sm_121a, sm_120a, sm_120f]

permissions:
  contents: read
  packages: write
  # Keyless signing; see publish-operator.yml for why there is no private key.
  # The certificate binds the signature to this workflow, in this repository, at
  # this ref — so the identity a consumer verifies IS the CI that built it.
  id-token: write

# Three jobs, and the split is not cosmetic.
#
# ONE JOB PER PLATFORM, EACH ON ITS OWN ARCHITECTURE, so nothing is emulated.
# The previous single-job form built both platforms on one host, which meant one
# of them ran under QEMU: nccl took 2h38m in CI that way. This repository is
# public, so the arm64 hosted runners are free, and the same build is minutes.
#
# The tag is created ONLY by the merge job, and that is a safety property worth
# stating. Each build pushes by DIGEST — content, no tag — so a build that fails
# on one platform leaves unreferenced blobs and no version tag at all. The old
# form pushed the tag as part of the build, so a partial failure could burn an
# immutable version number that nothing can reuse. Publishing is now
# all-or-nothing by construction.
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.ref.outputs.package }}
      image: ${{ steps.ref.outputs.image }}
      ref: ${{ steps.ref.outputs.ref }}
      arch: ${{ steps.arch.outputs.value }}
    steps:
      - name: Resolve image reference
        # github.repository_owner preserves the account's mixed case
        # ("baldwinSPC"), but registry references must be lowercase or buildx
        # rejects the tag outright. Lowercase once here so the tag and the job
        # summary cannot drift apart.
        id: ref
        env:
          # Do NOT name any of these RUNNER_* or GITHUB_*: those prefixes are
          # reserved by Actions and a job-level env: cannot override them, so
          # the value silently becomes the Actions runner's own (which produced
          # the tag "glimmer-burnin-GitHub Actions 1000000847").
          OWNER: ${{ github.repository_owner }}
          KIND: ${{ inputs.runner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="glimmer-burnin-${KIND}"
          image="ghcr.io/${OWNER,,}/${package}"
          # Guard against any future expansion producing something the registry
          # will reject, rather than discovering it minutes into a build.
          if ! printf '%s' "${image}:${VERSION}" \
               | grep -qE '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9._-]+$'; then
            echo "::error::refusing to build malformed reference '${image}:${VERSION}'"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publishing ${image}:${VERSION}"

      - name: Refuse to overwrite an existing tag
        # An image tag that a readiness gate pins must be immutable: silently
        # republishing it would change every node's verdict with no audit trail.
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.ref.outputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          # GITHUB_TOKEN is repo-scoped and may not be able to read user-level
          # packages. Distinguish "tag is absent" from "could not check": only
          # the former is safe to treat as a green light.
          if tags=$(gh api "user/packages/container/${PACKAGE}/versions" \
                      --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            if grep -qx "${VERSION}" <<<"${tags}"; then
              echo "::error::${PACKAGE}:${VERSION} already exists — pick a new version"
              exit 1
            fi
            echo "tag ${VERSION} is free"
          else
            echo "::warning::could not list existing tags for ${PACKAGE} (token may lack package read). Proceeding without the immutability check."
          fi

      - name: Resolve the gencode build arg
        # `default` is the sentinel for "each Dockerfile's per-platform default",
        # and the Dockerfiles spell that as an EMPTY CUDA_ARCH. It is resolved in
        # a step rather than inline, because GitHub's `a && b || c` expression
        # idiom cannot yield an empty string: '' is falsy, so the `||` branch
        # would fire and pass the literal word "default" through to nvcc.
        id: arch
        env:
          IN: ${{ inputs.cuda_arch }}
        run: |
          set -euo pipefail
          if [ "${IN}" = default ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "cuda_arch=default: each Dockerfile picks its own per-platform gencode"
          else
            echo "value=${IN}" >> "$GITHUB_OUTPUT"
            echo "::warning::cuda_arch=${IN} is applied to BOTH linux/amd64 and linux/arm64. Check it is a gencode that exists on both, or publish one platform at a time."
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.host }}
    # A native build, not an emulated one. Generous rather than tight: this is a
    # backstop against a hung build, not a target.
    timeout-minutes: 120
    strategy:
      # Both platforms are attempted even if one fails, so a publish reports
      # which half is broken rather than only that something is.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            host: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            host: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      # Before anything pulls a layer. A hosted runner has roughly 14 GB free and
      # ships 20-30 GB of preinstalled toolchains nothing here uses; nccl and
      # gpudirect-rdma each pull a ~10 GB CUDA devel image plus a golang stage
      # plus an ubuntu runtime stage. The failure mode is an UNRETRIEVABLE log
      # (BlobNotFound), because the runner cannot write its own diagnostics once
      # the disk is full — see the long note in ci.yml.
      #
      # RECLAIM_PATHS is duplicated verbatim in ci.yml (twice) and
      # runners/pins_test.go fails if any of the copies drift.
      - name: Reclaim disk before the image build
        run: |
          set -uo pipefail
          RECLAIM_PATHS='/usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift'
          echo "== df before"; df -h /
          for d in ${RECLAIM_PATHS}; do
            # An absent path is NOT an error; see ci.yml.
            if [ ! -e "$d" ]; then echo "  absent   $d"; continue; fi
            if sudo rm -rf "$d"; then echo "  removed  $d"; else echo "  FAILED   $d"; fi
          done
          sudo docker system prune -af >/dev/null 2>&1 || true
          echo "== df after"; df -h /

      # NO setup-qemu: this job builds only its host's architecture. Its absence
      # is load-bearing — with QEMU installed, a mis-specified platform would
      # build slowly and succeed instead of failing loudly.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest (${{ matrix.platform }}, native)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: runners/${{ inputs.runner }}
          platforms: ${{ matrix.platform }}
          # push-by-digest publishes CONTENT and no tag. The merge job below is
          # the only thing that creates the version tag, which is what makes a
          # half-finished publish leave no tag rather than a broken one.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          build-args: |
            CUDA_ARCH=${{ needs.prepare.outputs.arch }}
          # `labels:` is a literal block scalar — every line in it becomes a
          # label, so no comments may go INSIDE it. Note on cuda-arch: it records
          # the INPUT, which for `default` means "each platform's own". The
          # authoritative per-platform record is the runner's own first line of
          # output; compute-smoke prints built_cuda_arch= before any gate.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Runner image for the glimmer-burnin ${{ inputs.runner }} TestKind
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            ai.glimmer.burnin.cuda-arch=${{ inputs.cuda_arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::build produced no digest"; exit 1
          fi
          mkdir -p /tmp/digests
          # The FILENAME carries the digest; the file itself is empty. That is
          # the documented buildx pattern and it keeps the merge step a simple
          # glob over a directory.
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "${{ matrix.platform }} -> ${DIGEST}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the manifest list
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          count=$(ls -1 | wc -l)
          if [ "${count}" -ne 2 ]; then
            echo "::error::expected 2 per-platform digests, found ${count}. Refusing to tag a partial manifest list."
            ls -la; exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "${REF}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - uses: sigstore/cosign-installer@v3

      - name: Sign the manifest list and both per-architecture images
        # THREE signatures, and each is separately pullable.
        #
        # The manifest list is what a node's readiness gate references. But the
        # per-architecture children are pullable by digest in their own right —
        # a mirror, a registry proxy, or anything resolving a platform before it
        # pulls will reference a child directly — and a signature on the list
        # alone says nothing about those. Signing all three means the thing that
        # is actually pulled is signed whichever way it was reached.
        #
        # Digests throughout. A signature over a tag would still verify after
        # the tag moved, which is exactly the situation it exists to detect.
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail

          # The manifest list's own digest, read back from the registry rather
          # than assumed: imagetools create does not report it, and computing it
          # locally would be signing what we think we pushed rather than what is
          # there.
          LIST_DIGEST=$(docker buildx imagetools inspect "${REF}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "${LIST_DIGEST}" ]; then
            echo "::error::could not resolve the manifest list digest; refusing to sign nothing"
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${LIST_DIGEST}"

          # The children, from the digest files the build jobs left behind. The
          # count was already asserted to be 2 above, before the tag was created.
          for f in /tmp/digests/*; do
            cosign sign --yes "${IMAGE}@sha256:$(basename "${f}")"
          done

      - name: Assert the tag really serves both platforms
        # The point of the whole rewrite is a tag an x86 node and a Grace node can
        # both pull. A manifest list that silently lost a platform would publish
        # an immutable tag that half the fleet cannot run, and the failure would
        # surface as an ImagePullBackOff on the nodes rather than here.
        #
        # This is a CONFIRMATION, not the guard. It necessarily runs after
        # `imagetools create`, because there is no tag to inspect before that, so
        # a failure here means a bad tag already exists. The step that actually
        # prevents one is the digest count above, which refuses to create anything
        # unless both platforms pushed.
        #
        # The registry pretty-prints its JSON — `"architecture": "amd64"`, with a
        # space — and the first version of this matched `"architecture":"amd64"`
        # with none. It failed against a manifest list that was completely
        # correct, which is the right direction for a check to be wrong in, but it
        # cost a run.
        #
        # The whitespace was only the trigger. What made that failure expensive to
        # read is that a step which could not PARSE its input still delivered a
        # verdict about the artefact — "does not serve linux/amd64" about a tag
        # that served it — and the obvious response to that message is to re-cut a
        # release which was in fact correct. So the manifest is parsed structurally
        # now, and the two situations are kept apart on every branch below: a
        # platform genuinely absent is a verdict about the image, and ANY failure
        # to read says outright that it is not one. It is the same distinction the
        # operator draws between Fail and Error, for the same reason.
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail

          # An entry with NO platform block is dropped rather than rendered as
          # "null/null". That is not pedantry: a rendered null is a non-empty
          # result, so it would sail past the could-not-read branch below and come
          # back out as "does not serve linux/amd64" — this same bug, one layer
          # down. The fixture covers that shape.
          platforms() {
            jq -r '[.manifests[]
                    | .platform // {}
                    | select((.os // "") != "" and (.architecture // "") != "")
                    | select(.os != "unknown" and .architecture != "unknown")
                    | "\(.os)/\(.architecture)"] | unique | .[]'
          }

          # The parser is exercised on known-good input before it is trusted on the
          # real thing. A silent change in the inspect output would otherwise leave
          # the expression matching nothing at all, which is precisely how the
          # first version of this step came to fail a correct release.
          self_test='{"manifests":[
            {"platform":{"architecture":"arm64","os":"linux"}},
            {"platform":{"architecture":"unknown","os":"unknown"},
             "annotations":{"vnd.docker.reference.type":"attestation-manifest"}},
            {"digest":"sha256:no-platform-block-at-all"},
            {"platform":{"architecture":"amd64","os":"linux"}}]}'
          if [ "$(platforms <<<"${self_test}" | tr '\n' ' ')" != "linux/amd64 linux/arm64 " ]; then
            echo "::error::the platform extraction in this step is broken — it cannot read a known-good index, so it proves NOTHING about ${REF}. This is a bug in this workflow, not in the image."
            platforms <<<"${self_test}" || true
            exit 1
          fi

          if ! raw=$(docker buildx imagetools inspect "${REF}" --raw); then
            echo "::error::could not inspect ${REF}. The tag was pushed but cannot be read back, so it is UNVERIFIED — this is not a statement that it is wrong."
            exit 1
          fi

          # A multi-platform tag has to be an index. A plain image manifest has no
          # .manifests at all, and must not be reported as unreadable.
          if [ "$(jq -r 'has("manifests")' <<<"${raw}")" != "true" ]; then
            echo "::error::${REF} is not a manifest list (mediaType $(jq -r '.mediaType // "absent"' <<<"${raw}")) — it can serve at most one platform"
            jq . <<<"${raw}"
            exit 1
          fi

          # Attestation manifests ride in the same index as unknown/unknown. They
          # are not platforms and must never be counted as one.
          got=$(platforms <<<"${raw}")
          if [ -z "${got}" ]; then
            echo "::error::${REF} parsed as an index but named no platform at all. This check proved NOTHING about the tag — do NOT read it as a verdict on the image, and do not re-cut a release over it. The inspect output has changed shape and this step needs fixing."
            jq . <<<"${raw}"
            exit 1
          fi

          echo "platforms in ${REF}:"
          sed 's/^/  /' <<<"${got}"

          # Every missing platform is named, not just the first: fixing one and
          # rediscovering the next is two publish cycles for one fault, and a
          # publish cycle burns a version number that cannot be reused.
          missing=""
          for want in linux/amd64 linux/arm64; do
            grep -qxF "${want}" <<<"${got}" || missing="${missing} ${want}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::${REF} does not serve:${missing}"
            docker buildx imagetools inspect "${REF}" || true
            exit 1
          fi
          echo "both platforms present in ${REF}"

      - name: Report
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo '```'
            echo "image: ${REF}"
            docker buildx imagetools inspect "${REF}" | sed -n '1,12p'
            echo '```'
            echo "NOTE: a newly created GHCR package is PRIVATE. Agents pull anonymously,"
            echo "so set the package visibility to Public before rolling the agent."
          } >> "$GITHUB_STEP_SUMMARY"
