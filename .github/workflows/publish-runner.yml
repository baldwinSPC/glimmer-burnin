name: Publish runner image

# Publishing is deliberate and manual: a runner image is what a node's readiness
# gate executes, so a bad tag silently degrades a whole fleet. Trigger this only
# after the runner has been verified on real hardware.
#
# The options list must name every directory under runners/ that has a
# Dockerfile, or that runner cannot be published at all — and a default runner
# image entry in internal/controller/pods.go pointing at a tag no workflow can
# produce is an ImagePullBackOff with no way out.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Which runner to publish (a directory under runners/)'
        required: true
        default: compute-smoke
        type: choice
        options:
          - compute-smoke
          - clockprobe
          - dcgm-diag
          - host-health
          - memory-bw
          - memory-stress
          - thermal-soak
          - gpu-burn
          - power-swing
          - ib-write-bw
          - nccl
          - gpudirect-rdma
          - tcp-baseline
          - disk-io
          - fabric-soak
          - fingerprint-probe
          - gemm-sweep
          # amd64-only (ROCm toolchain and every AMD accelerator host are
          # amd64). The prepare job's "Determine which platforms this runner
          # builds" step reads this same fact from a hardcoded list that
          # mirrors ci.yml's runner-images matrix `exclude:` — keep both in
          # step (#319).
          - clockprobe-rocm
          - compute-smoke-rocm
          - memory-bw-rocm
          - nccl-rocm
          - thermal-soak-rocm
          - gpu-burn-rocm
      version:
        description: 'Image tag to publish (e.g. v0.1.0). Must not already exist.'
        required: true
        type: string
      cuda_arch:
        description: >-
          GPU gencode for the runners that compile device code (compute-smoke,
          gemm-sweep, nccl, memory-bw). This is the GPU axis and is INDEPENDENT
          of the host architecture: the image is always built for linux/amd64
          AND linux/arm64. `default` uses each Dockerfile's PER-PLATFORM default
          (compute-smoke and gemm-sweep arm64 sm_121a / amd64 sm_120a; nccl
          arm64 sm_121 / amd64 sm_90) and is almost always what you want — an explicit value is
          applied to BOTH platforms, so sm_121a here produces an amd64 image
          full of GB10 code that no x86 host can run. Ignored by the CPU-only
          runners (host-health, memory-stress, ib-write-bw, tcp-baseline), by
          dcgm-diag, and
          by the soak family (clockprobe, thermal-soak, gpu-burn, power-swing),
          whose Dockerfiles compile a fixed multi-gencode list instead.
        required: true
        default: default
        type: choice
        options: [default, sm_121a, sm_120a, sm_120f]

permissions:
  contents: read
  packages: write
  # Keyless signing; see publish-operator.yml for why there is no private key.
  # The certificate binds the signature to this workflow, in this repository, at
  # this ref — so the identity a consumer verifies IS the CI that built it.
  id-token: write

# Three jobs, and the split is not cosmetic.
#
# ONE JOB PER PLATFORM, EACH ON ITS OWN ARCHITECTURE, so nothing is emulated.
# The previous single-job form built both platforms on one host, which meant one
# of them ran under QEMU: nccl took 2h38m in CI that way. This repository is
# public, so the arm64 hosted runners are free, and the same build is minutes.
#
# The tag is created ONLY by the merge job, and that is a safety property worth
# stating. Each build pushes by DIGEST — content, no tag — so a build that fails
# on one platform leaves unreferenced blobs and no version tag at all. The old
# form pushed the tag as part of the build, so a partial failure could burn an
# immutable version number that nothing can reuse. Publishing is now
# all-or-nothing by construction.
#
# "ONE JOB PER PLATFORM" assumed two platforms for every runner, and that broke
# the moment a ROCm runner needed publishing: the ROCm toolchain and every AMD
# accelerator host this fleet could measure with it are amd64-only, so an
# arm64 leg would build an image for a machine that does not exist — and the
# merge job's own both-platforms assertion would then refuse to tag a correct,
# complete amd64-only publish. The prepare job now resolves a PER-RUNNER
# platform list (`platform_matrix`, `want_platforms`, `platform_count`), the
# build job's matrix is generated from it instead of hardcoded, and the merge
# job's assertions check against it instead of a literal two. Which runners are
# amd64-only is the SAME hardcoded list ci.yml's runner-images matrix already
# excludes arm64 for — see "Determine which platforms this runner builds" below
# — kept as one list, not two, because a second copy is a second place to drift
# (#319).
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.ref.outputs.package }}
      image: ${{ steps.ref.outputs.image }}
      ref: ${{ steps.ref.outputs.ref }}
      arch: ${{ steps.arch.outputs.value }}
      platform_matrix: ${{ steps.platforms.outputs.matrix }}
      want_platforms: ${{ steps.platforms.outputs.want }}
      platform_count: ${{ steps.platforms.outputs.count }}
    steps:
      - name: Resolve image reference
        # github.repository_owner preserves the account's mixed case
        # ("baldwinSPC"), but registry references must be lowercase or buildx
        # rejects the tag outright. Lowercase once here so the tag and the job
        # summary cannot drift apart.
        id: ref
        env:
          # Do NOT name any of these RUNNER_* or GITHUB_*: those prefixes are
          # reserved by Actions and a job-level env: cannot override them, so
          # the value silently becomes the Actions runner's own (which produced
          # the tag "glimmer-burnin-GitHub Actions 1000000847").
          OWNER: ${{ github.repository_owner }}
          KIND: ${{ inputs.runner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="glimmer-burnin-${KIND}"
          image="ghcr.io/${OWNER,,}/${package}"
          # Guard against any future expansion producing something the registry
          # will reject, rather than discovering it minutes into a build.
          if ! printf '%s' "${image}:${VERSION}" \
               | grep -qE '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+:[A-Za-z0-9._-]+$'; then
            echo "::error::refusing to build malformed reference '${image}:${VERSION}'"
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publishing ${image}:${VERSION}"

      - name: Refuse to overwrite an existing tag
        # An image tag that a readiness gate pins must be immutable: silently
        # republishing it would change every node's verdict with no audit trail.
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.ref.outputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -uo pipefail
          # GITHUB_TOKEN is repo-scoped and may not be able to read user-level
          # packages. Distinguish "tag is absent" from "could not check": only
          # the former is safe to treat as a green light.
          if tags=$(gh api "user/packages/container/${PACKAGE}/versions" \
                      --jq '.[].metadata.container.tags[]' 2>/dev/null); then
            if grep -qx "${VERSION}" <<<"${tags}"; then
              echo "::error::${PACKAGE}:${VERSION} already exists — pick a new version"
              exit 1
            fi
            echo "tag ${VERSION} is free"
          else
            echo "::warning::could not list existing tags for ${PACKAGE} (token may lack package read). Proceeding without the immutability check."
          fi

      - name: Resolve the gencode build arg
        # `default` is the sentinel for "each Dockerfile's per-platform default",
        # and the Dockerfiles spell that as an EMPTY CUDA_ARCH. It is resolved in
        # a step rather than inline, because GitHub's `a && b || c` expression
        # idiom cannot yield an empty string: '' is falsy, so the `||` branch
        # would fire and pass the literal word "default" through to nvcc.
        id: arch
        env:
          IN: ${{ inputs.cuda_arch }}
        run: |
          set -euo pipefail
          if [ "${IN}" = default ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "cuda_arch=default: each Dockerfile picks its own per-platform gencode"
          else
            echo "value=${IN}" >> "$GITHUB_OUTPUT"
            echo "::warning::cuda_arch=${IN} is applied to BOTH linux/amd64 and linux/arm64. Check it is a gencode that exists on both, or publish one platform at a time."
          fi

      - name: Determine which platforms this runner builds
        # Every runner here is two-platform EXCEPT the ROCm ones: AMD publishes
        # the ROCm apt toolchain for linux/amd64 only, and every AMD accelerator
        # host this fleet could measure with it (Strix Halo APUs, Instinct) is
        # amd64 too — an arm64 leg would build an image for a machine that does
        # not exist, exactly as ci.yml's runner-images job already reasons for
        # its own matrix.
        #
        # This is that SAME list, copied verbatim rather than derived some other
        # way, because ci.yml's own `exclude:` is itself a hardcoded list, not a
        # marker file or a naming-convention check — reusing its shape here
        # means one list to update when a future amd64-only runner is added,
        # instead of two that can silently disagree about which runners those
        # are. If this drifts from ci.yml, the drift is between two hardcoded
        # lists in two files; nothing enforces that today, so keep them beside
        # each other under review (#319).
        #
        # The three outputs are what the rest of this workflow needed to stop
        # assuming two platforms: `matrix` is the build job's `strategy.matrix
        # .include` (one entry for amd64-only, two otherwise); `want` is the
        # space-separated platform list the merge job's final assertion must
        # see served, in full, and nothing else; `count` is the exact number of
        # per-platform digests the merge job requires before it will create a
        # manifest list at all.
        id: platforms
        env:
          KIND: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          case "${KIND}" in
            clockprobe-rocm|compute-smoke-rocm|memory-bw-rocm|nccl-rocm|thermal-soak-rocm|gpu-burn-rocm)
              echo "::notice::${KIND} is amd64-only (ROCm); publishing linux/amd64 alone, no arm64 leg"
              echo 'matrix=[{"platform":"linux/amd64","host":"ubuntu-latest","arch":"amd64"}]' >> "$GITHUB_OUTPUT"
              echo "want=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "count=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "${KIND} builds both platforms"
              echo 'matrix=[{"platform":"linux/amd64","host":"ubuntu-latest","arch":"amd64"},{"platform":"linux/arm64","host":"ubuntu-24.04-arm","arch":"arm64"}]' >> "$GITHUB_OUTPUT"
              echo "want=linux/amd64 linux/arm64" >> "$GITHUB_OUTPUT"
              echo "count=2" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: prepare
    runs-on: ${{ matrix.host }}
    # A native build, not an emulated one. Generous rather than tight: this is a
    # backstop against a hung build, not a target.
    timeout-minutes: 120
    strategy:
      # Both platforms are attempted even if one fails (for a runner that
      # builds both at all), so a publish reports which half is broken rather
      # than only that something is.
      fail-fast: false
      # Generated by the prepare job's "Determine which platforms this runner
      # builds" step rather than hardcoded here, so an amd64-only runner (see
      # that step) gets a single-entry matrix instead of an arm64 leg that
      # would build an image for a host that cannot run it.
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platform_matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Before anything pulls a layer. A hosted runner has roughly 14 GB free and
      # ships 20-30 GB of preinstalled toolchains nothing here uses; nccl and
      # gpudirect-rdma each pull a ~10 GB CUDA devel image plus a golang stage
      # plus an ubuntu runtime stage. The failure mode is an UNRETRIEVABLE log
      # (BlobNotFound), because the runner cannot write its own diagnostics once
      # the disk is full — see the long note in ci.yml.
      #
      # RECLAIM_PATHS is duplicated verbatim in ci.yml (twice) and
      # runners/pins_test.go fails if any of the copies drift.
      - name: Reclaim disk before the image build
        run: |
          set -uo pipefail
          RECLAIM_PATHS='/usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift'
          echo "== df before"; df -h /
          for d in ${RECLAIM_PATHS}; do
            # An absent path is NOT an error; see ci.yml.
            if [ ! -e "$d" ]; then echo "  absent   $d"; continue; fi
            if sudo rm -rf "$d"; then echo "  removed  $d"; else echo "  FAILED   $d"; fi
          done
          sudo docker system prune -af >/dev/null 2>&1 || true
          echo "== df after"; df -h /

      # NO setup-qemu: this job builds only its host's architecture. Its absence
      # is load-bearing — with QEMU installed, a mis-specified platform would
      # build slowly and succeed instead of failing loudly.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest (${{ matrix.platform }}, native)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: runners/${{ inputs.runner }}
          platforms: ${{ matrix.platform }}
          # push-by-digest publishes CONTENT and no tag. The merge job below is
          # the only thing that creates the version tag, which is what makes a
          # half-finished publish leave no tag rather than a broken one.
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          build-args: |
            CUDA_ARCH=${{ needs.prepare.outputs.arch }}
          # `labels:` is a literal block scalar — every line in it becomes a
          # label, so no comments may go INSIDE it. Note on cuda-arch: it records
          # the INPUT, which for `default` means "each platform's own". The
          # authoritative per-platform record is the runner's own first line of
          # output; compute-smoke prints built_cuda_arch= before any gate.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Runner image for the glimmer-burnin ${{ inputs.runner }} TestKind
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            ai.glimmer.burnin.cuda-arch=${{ inputs.cuda_arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::build produced no digest"; exit 1
          fi
          mkdir -p /tmp/digests
          # The FILENAME carries the digest; the file itself is empty. That is
          # the documented buildx pattern and it keeps the merge step a simple
          # glob over a directory.
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "${{ matrix.platform }} -> ${DIGEST}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the manifest list
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          REF: ${{ needs.prepare.outputs.ref }}
          # From the prepare job's "Determine which platforms this runner
          # builds": 1 for an amd64-only ROCm runner, 2 for everything else.
          EXPECTED_COUNT: ${{ needs.prepare.outputs.platform_count }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          count=$(ls -1 | wc -l)
          if [ "${count}" -ne "${EXPECTED_COUNT}" ]; then
            echo "::error::expected ${EXPECTED_COUNT} per-platform digest(s) for this runner, found ${count}. Refusing to tag a partial manifest list."
            ls -la; exit 1
          fi
          # --prefer-index=true is buildx's own current default for a
          # single-source create, but pinned explicitly rather than relied on:
          # with ONE digest (an amd64-only runner) the alternative is a carbon
          # copy of that source manifest rather than an index wrapping it, and
          # the platform assertion below can only read a manifest LIST. A future
          # default flip would silently turn a correct amd64-only publish into a
          # bare manifest, and the assertion would then report "not a manifest
          # list" — which reads as a broken image, not as this flag having moved
          # under us.
          # shellcheck disable=SC2046
          docker buildx imagetools create --prefer-index=true -t "${REF}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - uses: sigstore/cosign-installer@v3

      - name: Sign the manifest list and every per-architecture image
        # The manifest list plus one signature per platform child — three for a
        # two-platform runner, two for an amd64-only ROCm one (see the prepare
        # job) — and each is separately pullable.
        #
        # The manifest list is what a node's readiness gate references. But the
        # per-architecture children are pullable by digest in their own right —
        # a mirror, a registry proxy, or anything resolving a platform before it
        # pulls will reference a child directly — and a signature on the list
        # alone says nothing about those. Signing every one of them means the
        # thing that is actually pulled is signed whichever way it was reached.
        #
        # Digests throughout. A signature over a tag would still verify after
        # the tag moved, which is exactly the situation it exists to detect.
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail

          # The manifest list's own digest, read back from the registry rather
          # than assumed: imagetools create does not report it, and computing it
          # locally would be signing what we think we pushed rather than what is
          # there.
          LIST_DIGEST=$(docker buildx imagetools inspect "${REF}" \
            --format '{{.Manifest.Digest}}')
          if [ -z "${LIST_DIGEST}" ]; then
            echo "::error::could not resolve the manifest list digest; refusing to sign nothing"
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${LIST_DIGEST}"

          # The children, from the digest files the build jobs left behind. The
          # count was already asserted above, before the tag was created, to
          # match this runner's declared platform count.
          for f in /tmp/digests/*; do
            cosign sign --yes "${IMAGE}@sha256:$(basename "${f}")"
          done

      - name: Assert the tag serves exactly its declared platforms
        # The point of the whole rewrite is a tag an x86 node and a Grace node can
        # both pull. A manifest list that silently lost a platform would publish
        # an immutable tag that half the fleet cannot run, and the failure would
        # surface as an ImagePullBackOff on the nodes rather than here.
        #
        # This is a CONFIRMATION, not the guard. It necessarily runs after
        # `imagetools create`, because there is no tag to inspect before that, so
        # a failure here means a bad tag already exists. The step that actually
        # prevents one is the digest count above, which refuses to create anything
        # unless every platform this runner is DECLARED to build actually pushed.
        #
        # DECLARED, not hardcoded to two: an amd64-only ROCm runner (see the
        # prepare job's "Determine which platforms this runner builds") is
        # correct with exactly linux/amd64 and no arm64 leg at all, so this step
        # checks WANT — the space-separated platform list that step resolved —
        # rather than the literal pair every runner used to be held to. Two
        # directions both matter and neither is new: a platform the runner is
        # supposed to serve and does not is a lost platform, exactly as before;
        # a platform present that the runner was NOT supposed to build at all
        # (arm64 riding along on an amd64-only publish) is a wasted, incorrect
        # build that must not be allowed to pass just because "extra" sounds
        # harmless — it means the exclude this runner is supposed to have did
        # not take effect. Every non-ROCm runner still wants exactly
        # linux/amd64 and linux/arm64, so this is not a weaker check for them —
        # it is the same check, parameterised.
        #
        # The registry pretty-prints its JSON — `"architecture": "amd64"`, with a
        # space — and the first version of this matched `"architecture":"amd64"`
        # with none. It failed against a manifest list that was completely
        # correct, which is the right direction for a check to be wrong in, but it
        # cost a run.
        #
        # The whitespace was only the trigger. What made that failure expensive to
        # read is that a step which could not PARSE its input still delivered a
        # verdict about the artefact — "does not serve linux/amd64" about a tag
        # that served it — and the obvious response to that message is to re-cut a
        # release which was in fact correct. So the manifest is parsed structurally
        # now, and the two situations are kept apart on every branch below: a
        # platform genuinely absent (or genuinely extra) is a verdict about the
        # image, and ANY failure to read says outright that it is not one. It is
        # the same distinction the operator draws between Fail and Error, for the
        # same reason.
        env:
          REF: ${{ needs.prepare.outputs.ref }}
          # From the prepare job: "linux/amd64" for an amd64-only ROCm runner,
          # "linux/amd64 linux/arm64" for everything else.
          WANT: ${{ needs.prepare.outputs.want_platforms }}
        run: |
          set -euo pipefail

          # An entry with NO platform block is dropped rather than rendered as
          # "null/null". That is not pedantry: a rendered null is a non-empty
          # result, so it would sail past the could-not-read branch below and come
          # back out as "does not serve linux/amd64" — this same bug, one layer
          # down. The fixture covers that shape.
          platforms() {
            jq -r '[.manifests[]
                    | .platform // {}
                    | select((.os // "") != "" and (.architecture // "") != "")
                    | select(.os != "unknown" and .architecture != "unknown")
                    | "\(.os)/\(.architecture)"] | unique | .[]'
          }

          # The parser is exercised on known-good input before it is trusted on the
          # real thing. A silent change in the inspect output would otherwise leave
          # the expression matching nothing at all, which is precisely how the
          # first version of this step came to fail a correct release.
          self_test='{"manifests":[
            {"platform":{"architecture":"arm64","os":"linux"}},
            {"platform":{"architecture":"unknown","os":"unknown"},
             "annotations":{"vnd.docker.reference.type":"attestation-manifest"}},
            {"digest":"sha256:no-platform-block-at-all"},
            {"platform":{"architecture":"amd64","os":"linux"}}]}'
          if [ "$(platforms <<<"${self_test}" | tr '\n' ' ')" != "linux/amd64 linux/arm64 " ]; then
            echo "::error::the platform extraction in this step is broken — it cannot read a known-good index, so it proves NOTHING about ${REF}. This is a bug in this workflow, not in the image."
            platforms <<<"${self_test}" || true
            exit 1
          fi

          if ! raw=$(docker buildx imagetools inspect "${REF}" --raw); then
            echo "::error::could not inspect ${REF}. The tag was pushed but cannot be read back, so it is UNVERIFIED — this is not a statement that it is wrong."
            exit 1
          fi

          # A multi-platform tag has to be an index. A plain image manifest has no
          # .manifests at all, and must not be reported as unreadable.
          if [ "$(jq -r 'has("manifests")' <<<"${raw}")" != "true" ]; then
            echo "::error::${REF} is not a manifest list (mediaType $(jq -r '.mediaType // "absent"' <<<"${raw}")) — it can serve at most one platform"
            jq . <<<"${raw}"
            exit 1
          fi

          # Attestation manifests ride in the same index as unknown/unknown. They
          # are not platforms and must never be counted as one.
          got=$(platforms <<<"${raw}")
          if [ -z "${got}" ]; then
            echo "::error::${REF} parsed as an index but named no platform at all. This check proved NOTHING about the tag — do NOT read it as a verdict on the image, and do not re-cut a release over it. The inspect output has changed shape and this step needs fixing."
            jq . <<<"${raw}"
            exit 1
          fi

          echo "platforms in ${REF}:"
          sed 's/^/  /' <<<"${got}"
          echo "declared platforms for this runner: ${WANT}"

          # Every missing platform is named, not just the first: fixing one and
          # rediscovering the next is two publish cycles for one fault, and a
          # publish cycle burns a version number that cannot be reused.
          missing=""
          for want in ${WANT}; do
            grep -qxF "${want}" <<<"${got}" || missing="${missing} ${want}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::${REF} does not serve:${missing}"
            docker buildx imagetools inspect "${REF}" || true
            exit 1
          fi

          # The other direction: a platform present that WANT never asked for.
          # This is what catches arm64 riding along on an amd64-only ROCm
          # publish — a build that ran anyway, on a host that image cannot use,
          # and that the exclude this runner is supposed to have evidently did
          # not take effect for. A two-platform runner's WANT is both
          # platforms, so this branch is inert for it; it only bites when the
          # image serves more than it was declared to.
          unexpected=""
          for p in ${got}; do
            found=false
            for want in ${WANT}; do
              [ "${p}" = "${want}" ] && { found=true; break; }
            done
            [ "${found}" = false ] && unexpected="${unexpected} ${p}"
          done
          if [ -n "${unexpected}" ]; then
            echo "::error::${REF} serves platform(s) it was not declared to build:${unexpected}. This is a wasted, incorrect build — the amd64-only exclude for this runner did not take effect. Supersede the tag rather than trust it; do not repush."
            docker buildx imagetools inspect "${REF}" || true
            exit 1
          fi

          echo "exactly the declared platforms are present in ${REF}: ${WANT}"

      - name: Assert the published image carries a patched standard library
        # WHY THIS EXISTS. Every published v0.6.0 image was measured after the
        # fact and every Go one carried an unpatched standard library: the
        # operator on go1.26.5 (8 reachable vulnerabilities) and six runners on
        # go1.24.13 (29 each, because 1.24 is end-of-life and none of the
        # advisories were ever fixed on that branch). Nothing in this workflow
        # looked, so nothing said (#309).
        #
        # The Dockerfile pin is the guard — a runner image builds a THROWAWAY
        # module, so go.mod's toolchain never reaches it and GO_IMAGE is the only
        # thing deciding which standard library ships. runners/pins_test.go keeps
        # that pin from falling behind go.mod. This step is what proves the guard
        # worked on the artefact that actually got pushed.
        #
        # Like the platform assertion above, it is a CONFIRMATION rather than a
        # gate: there is no image to scan before it is pushed, so a failure here
        # means a bad tag already exists. Published tags are immutable, so the
        # response is to supersede it — never to repush.
        #
        # The two outcomes are kept apart on every branch below, the same way,
        # and for the same reason: "this image ships known-vulnerable code" is a
        # verdict about the artefact, and "this step could not read the image" is
        # emphatically not one. A scanner that cannot find a binary must not
        # report a clean image, and must not report a dirty one either.
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          if ! go run github.com/google/go-containerregistry/cmd/crane@v0.21.9 \
                 export "${REF}" - 2>"${workdir}/crane.err" | tar x -C "${workdir}" 2>/dev/null; then
            echo "::error::could not export ${REF} to scan it. This proves NOTHING about the image — do not read it as a verdict, and do not supersede a tag over it. $(tail -1 "${workdir}/crane.err" || true)"
            exit 1
          fi

          # The entrypoint is the binary this image exists to run. Resolving it
          # from the config rather than guessing a path keeps this working for
          # runners that install under a different name.
          entry="$(go run github.com/google/go-containerregistry/cmd/crane@v0.21.9 config "${REF}" \
                   | jq -r '.config.Entrypoint[0] // .config.Cmd[0] // empty')"
          if [ -z "${entry}" ]; then
            echo "::error::${REF} declares no entrypoint, so this step cannot tell which binary to scan. NOT a verdict about the image."
            exit 1
          fi
          bin="${workdir}${entry}"
          if [ ! -f "${bin}" ]; then
            echo "::error::${REF} names entrypoint ${entry}, which is not in the exported filesystem. NOT a verdict about the image — this step could not read it."
            exit 1
          fi

          # A C++/CUDA runner has no Go binary and nothing to say here. That is a
          # legitimate clean result, and distinguishing it from a scan that failed
          # is the whole point of the branches above.
          #
          # `go version -m`, NOT `go version`. This guard existed and never fired,
          # because `go version <non-Go file>` writes "not a Go executable" to
          # stderr and EXITS 0 — so the negation was always false and every
          # C++/CUDA runner fell through to govulncheck, which then died with
          # "unrecognized binary format" AFTER the tag was already pushed.
          # Measured: `go version /bin/ls` exits 0, `go version -m /bin/ls` exits
          # 1, and both exit 0 on a real Go binary. Publishing gemm-sweep:v0.6.4
          # is what surfaced it (#386) — a correct, signed, two-platform tag
          # reported as a failed publish.
          if ! go version -m "${bin}" >/dev/null 2>&1; then
            echo "${entry} is not a Go binary (C++/CUDA runner) — no Go standard library to check"
            exit 0
          fi
          echo "${entry} was built with: $(go version -m "${bin}" | head -1 | awk '{print $2}')"

          if go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -mode=binary "${bin}"; then
            echo "no known vulnerabilities in the standard library ${REF} ships"
            exit 0
          fi
          echo "::error::${REF} SHIPS KNOWN-VULNERABLE CODE. The tag exists and is immutable, so supersede it rather than repushing: bump ARG GO_IMAGE in this runner's Dockerfile if it is behind go.mod's toolchain, then publish a new tag and move the pkg/runnerimages pin. Note govulncheck reports symbols PRESENT in the binary, which is not the same as a path this runner drives — read the trace before deciding how urgent it is (#309)."
          exit 1

      - name: Report
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo '```'
            echo "image: ${REF}"
            docker buildx imagetools inspect "${REF}" | sed -n '1,12p'
            echo '```'
            echo "NOTE: a newly created GHCR package is PRIVATE. Agents pull anonymously,"
            echo "so set the package visibility to Public before rolling the agent."
          } >> "$GITHUB_STEP_SUMMARY"
