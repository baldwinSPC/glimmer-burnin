name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_runners:
        description: 'Build every runner image, not only the ones this change touches'
        type: boolean
        default: true
  schedule:
    # The full runner matrix, weekly. See the runner-plan job for why this is a
    # sweep on a timer rather than a gate on every PR.
    - cron: '23 5 * * 1'

permissions:
  contents: read

# A superseded PR run is wasted money here: the runner builds are QEMU builds
# billed by the minute. Pushes to main must NEVER be cancelled — main's history is
# what the weekly sweep and the publish workflow are reasoned about from.
#
# The separation is made by the GROUP, not by cancel-in-progress, and that is the
# whole point. This previously read
#
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#
# which put every push to main in ONE group and then tried to spare them with a
# flag. It did not: consecutive merges cancelled each other, timestamped to the
# second — the run for #99 died at 08:25:53, the second the run for #100 started
# at 08:25:52. Because the merge queue that night was busy, main's eleven-runner
# validation was killed every time before it finished, and a compute-smoke build
# break survived on main precisely because the only run that could see it was
# cancelled by the next merge.
#
# Giving each main push its own group (keyed by run_id, which is unique per run)
# makes cancellation structurally impossible there rather than conditionally
# suppressed. PR runs still share a group per ref, so a force-push still
# supersedes its predecessor.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Read the toolchain from go.mod so CI and local builds never drift.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then echo "gofmt needed on:"; echo "$fmt"; exit 1; fi

      # Runs on pull requests, which is the whole point: the image build itself
      # does not, so without this check a go.mod bump that outruns the
      # Dockerfile is green on every PR and breaks main on merge.
      #
      # Deliberately the root Dockerfile only. The Go-based runners pin their own
      # GO_IMAGE and are not bound by this go.mod: each runs `go mod init` inside
      # the image over stdlib-only sources with GOPROXY=off, so they compile under
      # any recent toolchain. Extending this check to them would force pointless
      # bumps on images that never read this module.
      - name: Dockerfile Go matches go.mod
        run: |
          want=$(awk '/^go [0-9]/ {split($2,v,"."); print v[1]"."v[2]; exit}' go.mod)
          have=$(awk 'match($0, /^FROM .*golang:[0-9]+\.[0-9]+/) {
                        s=substr($0, RSTART, RLENGTH); sub(/.*golang:/, "", s); print s; exit }' Dockerfile)
          if [ -z "$want" ] || [ -z "$have" ]; then
            echo "could not parse a Go version (go.mod='$want' Dockerfile='$have')"; exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "go.mod requires Go $want but Dockerfile builds with golang:$have."
            echo "Bump the FROM line in Dockerfile to golang:$want."
            exit 1
          fi
          echo "Dockerfile golang:$have matches go.mod $want"

      # The envtest control plane — a real kube-apiserver and etcd. test/envtest
      # is part of `go test ./...` and SKIPS ITSELF when these binaries are
      # absent, which is what keeps a laptop's `go test ./...` green. That skip
      # must never happen here, so the assets are installed and
      # BURNIN_ENVTEST=required below turns a missing control plane into a
      # failure rather than a silent pass.
      - name: Install envtest control plane
        run: |
          set -euo pipefail
          assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24 use 1.36.2 -p path)
          echo "KUBEBUILDER_ASSETS=${assets}" >> "$GITHUB_ENV"
          echo "envtest assets: ${assets}"

      # This also runs the checks that have no Go code of their own to attach to:
      # runners/pins_test.go (every upstream pinned to a commit, every runner
      # publishable), runners/ib-write-bw/fabric_contract_test.go and
      # runners/thermal-soak/soak_contract_test.go (the duplicated runner sources
      # have not drifted), and test/envtest (RBAC, CRD schema, status
      # subresource, and the destroy-after-durable-status invariant, against a
      # real apiserver).
      - name: Test
        env:
          BURNIN_ENVTEST: required
        run: go test ./... -count=1

      # The standalone invariant: this OSS operator must never depend on the
      # private Glimmer control plane. Integration is via BurnInSink only.
      - name: No Glimmer import (standalone guard)
        run: |
          if grep -rn --include='*.go' 'baldwinSPC/glimmer\(/\|"\)' . ; then
            echo "::error::glimmer-burnin must not import the Glimmer control plane — integrate via BurnInSink"
            exit 1
          fi
          echo "standalone: no glimmer import found"

      # Blocking. A stale CRD is not a cosmetic drift: config/crd is what a
      # cluster validates a BurnInTest against, so a field that exists in the Go
      # type and not in the manifest is silently dropped by the apiserver — the
      # run then executes a spec nobody wrote, and the operator's own defaulting
      # hides it.
      - name: CRD/deepcopy drift check
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 object:headerFile=hack/boilerplate.go.txt paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 crd rbac:roleName=burnin-manager-role webhook paths=./... output:crd:artifacts:config=config/crd output:rbac:artifacts:config=config/rbac
          git diff --exit-code api/ config/ || { echo "::error::generated code/manifests are stale — run 'make generate manifests' and commit"; exit 1; }

  # ── supply chain: licences, vulnerabilities, lint ─────────────────────────────
  #
  # BLOCKING, all three, like everything else in this file. #177 filed these as a
  # group because they share a failure mode: each enforces a rule the project
  # already believed it was following.
  #
  # The licence check is the one that matters most. CLAUDE.md says a copyleft
  # dependency would make this project unpublishable, and that rule was enforced
  # by PROSE. Individual runner Dockerfiles assert their upstream C project's
  # licence at build time — genuinely good, and it catches the case that has
  # actually bitten — but nothing looked at the Go module graph, so a transitive
  # dependency arriving under GPL passed every check this repository had.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # As everywhere else: the toolchain comes from go.mod so CI and a
          # laptop cannot drift. go.mod carries a `toolchain` directive as well
          # as a `go` directive, and the two say different things on purpose —
          # `go` is the language version a CONSUMER of pkg/verdict, pkg/runner,
          # pkg/contract or pkg/report must have, and raising it would force
          # every one of them to upgrade; `toolchain` is what WE build with, and
          # it is what govulncheck's verdict is about. Go's own toolchain
          # switching honours the directive even if the action installs the
          # older one, so this holds however setup-go resolves the file.
          go-version-file: go.mod
          cache: true

      - name: Licence policy (no copyleft, anywhere in the module graph)
        run: go run ./hack/licensecheck

      # First-party, and low-noise because it reports only vulnerabilities in
      # code paths actually REACHED. When this first ran, it found ten reachable
      # standard-library vulnerabilities — including an auth bypass in
      # crypto/x509 that internal/sink's webhook TLS path reaches — because the
      # toolchain in go.mod was months stale and nothing was looking.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Helm chart lints and renders
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint deploy/charts/glimmer-burnin
          helm template burnin deploy/charts/glimmer-burnin --namespace glimmer-burnin-system >/dev/null

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # ── e2e: the shipped manifests on a real cluster ──────────────────────────────
  #
  # THE MOST VALUABLE STEP IN THIS JOB IS NOT A TEST. It is "Apply config/ to the
  # cluster", and it runs first, before the image is even built. A release once
  # shipped with NO DEPLOYMENT MANIFEST AT ALL — an unanchored `manager` line in
  # .gitignore swallowed config/manager/ so `git add -A` skipped it for the whole
  # of v0.2.0 — and no Go test could have caught that, because the Go code was
  # fine. A job that simply applies config/ to a cluster would have.
  #
  # What the tests after it add is the other thing no unit test can have: a
  # SCHEDULER and a KUBELET. The operator once cordoned the node it was about to
  # test and then created a runner pod that did not tolerate that cordon —
  # deadlocking every test on every node — and neither the fake client (which
  # assigns pods) nor envtest (which never places them) can see it.
  #
  # CPU only, deliberately. Hosted runners have no GPU, and every bug this job
  # exists for is orchestration rather than compute: the runners here are `sh -c`
  # one-liners honouring the exit-code + key=value contract on a plain busybox.
  e2e:
    runs-on: ubuntu-latest
    # A cluster is minutes and build-test is one; there is no sense standing one
    # up for code that does not compile.
    needs: build-test
    timeout-minutes: 40
    env:
      # Bump alongside the node image kind ships with; kind picks its own default
      # node image, so nothing else here has to know the Kubernetes version.
      KIND_VERSION: v0.30.0
      KIND_CLUSTER: glimmer-burnin-e2e
      E2E_IMG: glimmer-burnin:e2e
      E2E_RUNNER_IMAGE: busybox:1.37.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Hosted runners ship ~14 GB free on /, and a kind node image plus a Go
      # toolchain layer plus the operator image is enough to matter. Two runner
      # image builds have already hit ENOSPC in this repository, and a job that
      # dies out of disk cannot even write its own logs.
      #
      # RECLAIM_PATHS is duplicated verbatim in the runner-image job below and in
      # publish-runner.yml; runners/pins_test.go fails if any of the three drift.
      - name: Reclaim disk
        run: |
          set -uo pipefail
          RECLAIM_PATHS='/usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift'
          echo "== df before"; df -h /
          for d in ${RECLAIM_PATHS}; do
            # An absent path is NOT an error — see the note on the runner-image
            # copy below.
            if [ ! -e "$d" ]; then echo "  absent   $d"; continue; fi
            if sudo rm -rf "$d"; then echo "  removed  $d"; else echo "  FAILED   $d"; fi
          done
          echo "== df after"; df -h /

      - name: Install kind
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          # setup-go does not reliably put GOPATH/bin on PATH for later steps.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v kubectl >/dev/null || {
            echo "::error::kubectl is not on PATH; the e2e job applies config/ with it"
            exit 1
          }

      - name: Create the cluster
        run: kind create cluster --name "$KIND_CLUSTER" --config test/e2e/kind.yaml --wait 3m

      # ─────────────────────────────────────────────────────────────────────────
      # THE GATE. Nothing below runs if the shipped manifests do not apply.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Apply config/ to the cluster
        run: |
          set -euo pipefail
          kubectl apply -f config/crd -f config/rbac -f config/manager
          kubectl wait --for=condition=Established --timeout=120s \
            crd/burninruns.burnin.glimmer.ai \
            crd/burnintests.burnin.glimmer.ai \
            crd/burninprofiles.burnin.glimmer.ai \
            crd/burninsinks.burnin.glimmer.ai \
            crd/burninschedules.burnin.glimmer.ai \
            crd/nodefingerprints.burnin.glimmer.ai
          # config/samples is deliberately NOT applied here. It contains
          # BurnInRuns and a BurnInSchedule, so a live operator would start
          # executing them — cordoning this cluster's nodes and pulling images
          # that do not exist — and the e2e's own runs would be sharing the fleet
          # with them. The samples are validated against a real apiserver in
          # test/envtest, where no controller is watching.

      - name: Build and load the operator image
        run: |
          set -euo pipefail
          docker build -t "$E2E_IMG" .
          kind load docker-image "$E2E_IMG" --name "$KIND_CLUSTER"

      - name: Load the CPU runner image
        run: |
          set -euo pipefail
          # Loaded rather than pulled from inside the cluster: podForTest sets no
          # imagePullPolicy, so a tagged image defaults to IfNotPresent and the
          # runners never need registry access from a kind node.
          docker pull "$E2E_RUNNER_IMAGE"
          kind load docker-image "$E2E_RUNNER_IMAGE" --name "$KIND_CLUSTER"

      - name: Run the operator
        run: |
          set -euo pipefail
          # config/manager pins a published tag this cluster cannot pull; point
          # it at the image just built from this commit.
          kubectl -n glimmer-burnin-system set image \
            deployment/burnin-controller-manager manager="$E2E_IMG"
          kubectl -n glimmer-burnin-system rollout status \
            deployment/burnin-controller-manager --timeout=5m

      - name: e2e (core)
        # Spelled out one name per alternative rather than as a TestA(...) group.
        # The group form silently excluded TestAnUndeclaredExitTwoIsAnErrorNotASkip
        # — "TestA" followed by "nUndeclared" matches no alternative — so that test
        # was compiled, reviewed, green, and never executed. test/e2e's
        # TestEveryE2ETestIsSelectedByTheWorkflow now fails if any test is selected
        # by neither filter or by both, but a pattern that reads literally is what
        # keeps the next person out of the same trap.
        run: go test -tags e2e ./test/e2e/... -count=1 -v -timeout 20m -run 'TestThe|TestANodeScope|TestAThresholdViolation|TestASkippingRunner|TestAPairScope|TestAGroupScope|TestAnUndeclaredExitTwo'

      # The chaos tests are the slow half — each one waits out a manager restart
      # and a leader-election lease — so they run on main, on the weekly sweep and
      # on demand, not on every PR.
      #
      # WHAT THAT LEAVES UNGUARDED, stated rather than glossed: between merges,
      # a change can break CLUSTER-LEVEL recovery (a cordon stranded by a manager
      # that died holding it, a run that restarts a test it was already running)
      # and this workflow will not say so until the merge to main. It is a
      # narrower gap than it sounds, because the same properties are asserted
      # deterministically on every PR by test/envtest, which injects the
      # resourceVersion conflict instead of racing a rollout for it. What is
      # genuinely PR-unguarded is the interaction with a real kubelet: a pod
      # SIGTERMed by a departing manager, and the lease handover itself.
      - name: e2e (chaos — manager restart and rolling-update overlap)
        if: github.event_name != 'pull_request'
        run: go test -tags e2e ./test/e2e/... -count=1 -v -timeout 20m -run 'TestKillingTheManager|TestARollingUpdate|TestDeletingARunMidFlight'

      - name: Operator logs
        if: failure()
        run: |
          kubectl -n glimmer-burnin-system logs -l control-plane=burnin-controller --tail=400 --prefix || true
          kubectl get burninruns -A -o yaml || true
          kubectl get nodes -o wide || true

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-arch image (no push on CI)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          tags: ghcr.io/baldwinspc/glimmer-burnin:ci

  # ── which runner images to build ──────────────────────────────────────────────
  #
  # Every directory under runners/ produces an image a node's readiness gate
  # executes. Two of them once shipped in a PR having never been built at all —
  # memory-bw with an ARG a later FROM could not see, dcgm-diag with a Go compile
  # error — because CI built exactly one runner, compute-smoke, and only on
  # workflow_dispatch. That job is gone; this plans the matrix instead.
  #
  # The list comes from the FILESYSTEM, never from a hand-written array, so a
  # twelfth runner is covered the moment its directory exists. (runners/pins_test.go
  # holds the other end of that: it fails if a runner directory has no Dockerfile,
  # or is missing from the publish workflow's choice list.)
  #
  # WHY THIS IS NOT SIMPLY "BUILD ALL ELEVEN ON EVERY PR", which is what it should
  # be: every arm64 stage runs under QEMU on the default hosted runner. One
  # measured data point: compute-smoke, the cheapest of the CUDA runners, took
  # 14m19s cold. The heavy ones compile six gencodes of a template-dense .cu, or
  # build NCCL from source, under that emulation. Eleven of those on every push
  # would spend hours of billed minutes to rebuild code the push did not touch.
  #
  # The images are now built for linux/amd64 AND linux/arm64. That does NOT
  # double the bill: amd64 is native on these hosted runners, so the added half
  # runs at full speed while the pre-existing arm64 half stays the expensive one.
  # The cheap tier below is unaffected, because a runner in it has no emulated
  # stage on EITHER platform.
  #
  # So the selection is:
  #
  #   * the runners this change TOUCHES — which is the case that matters, because
  #     a runner's Docker build context is its own directory and nothing else can
  #     affect it. The PR that shipped the two broken Dockerfiles touched exactly
  #     those directories;
  #   * plus the runners that cost almost nothing (every build stage is
  #     --platform=$BUILDPLATFORM, so nothing runs emulated), as a standing smoke
  #     test that the build tooling itself still works;
  #   * plus, WEEKLY and on demand, all of them — which is what catches the decay
  #     no diff of ours causes: a base image that moved, an apt package that
  #     vanished, an upstream that retagged.
  #
  # What that leaves unguarded: for up to seven days, a runner can break for a
  # reason outside its own directory and this workflow will not say so.
  #
  # THE REPOSITORY IS NOW PUBLIC, so GitHub's free arm64 hosted runners are
  # available and the constraint above is no longer the money it once was. The
  # fix is NOT "run everything on an arm64 host" — with two platforms that only
  # moves the emulation to the other half. The right shape is one job per
  # platform (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64), each building
  # natively and pushing by digest, with a merge step assembling the manifest
  # list; then building every runner on every PR is the honest thing to do. That
  # is a bigger change than this one and is deliberately not folded into it. The
  # ARM64_RUNNER variable below remains the stopgap that makes the arm64 half
  # native at the cost of emulating the amd64 half.
  runner-plan:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The plan diffs against the merge base, so the history has to be there.
          fetch-depth: 0

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all_runners }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Space-separated, not newline-separated: this is both iterated over and
          # membership-tested with `case " $all " in *" $d "*`, and that pattern
          # silently matches nothing against newlines.
          all=$(ls -d runners/*/ | xargs -n1 basename | sort | tr '\n' ' ')

          # A runner is CHEAP when no RUN executes in an emulated stage — that is,
          # every stage with work in it is pinned to --platform=$BUILDPLATFORM and
          # cross-compiles. Derived rather than listed so a new Go-only runner
          # joins the per-PR tier by itself, and a runner that grows an emulated
          # stage leaves it by itself.
          cheap=""
          for d in $all; do
            if [ "$(awk '
                  /^[[:space:]]*FROM[[:space:]]/ { emulated = (index($0, "--platform=$BUILDPLATFORM") == 0); next }
                  /^[[:space:]]*RUN[[:space:]]/  { if (emulated) slow = 1 }
                  END { print (slow ? "slow" : "cheap") }' "runners/$d/Dockerfile")" = cheap ]; then
              cheap="$cheap $d"
            fi
          done

          selected=""
          why=""
          if [ "$EVENT" = schedule ] || [ "$ALL" = true ]; then
            selected="$all"
            why="full sweep (${EVENT})"
          else
            case "$EVENT" in
              pull_request) base="$BASE_SHA" ;;
              push)         base="$BEFORE_SHA" ;;
              *)            base="" ;;
            esac

            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # No usable base — a new branch, or a force-push. Build everything
              # rather than guess: an unbuilt runner is the failure this job exists
              # to prevent, and a slow run is the cheaper mistake.
              selected="$all"
              why="no usable diff base; building all"
            else
              changed=$(git diff --name-only "$base"...HEAD -- runners/ | cut -d/ -f2 | sort -u || true)
              touched=""
              for d in $changed; do
                case " $all " in *" $d "*) touched="$touched $d" ;; esac
              done
              selected=$(printf '%s\n' $touched $cheap | sort -u)
              why="changed:${touched:- none} + always:${cheap}"
            fi
          fi

          json=$(printf '%s\n' $selected | jq -R . | jq -sc 'map(select(length > 0))')
          echo "runners=${json}" >> "$GITHUB_OUTPUT"

          {
            echo "### Runner image matrix"
            echo
            echo "- selection: \`${why}\`"
            echo "- building: \`${json}\`"
            echo "- cheap tier (no emulated stage):\`${cheap}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── build the runner images ───────────────────────────────────────────────────
  # Build only: publishing is a deliberate, separately-approved step in
  # publish-runner.yml, and this job holds no registry credentials at all.
  runner-images:
    # build-test is a minute and these are hours: there is no sense spending QEMU
    # time on a change that does not compile.
    needs: [build-test, runner-plan]
    if: needs.runner-plan.outputs.runners != '[]'
    # ONE JOB PER (runner, platform), each on a host of its own architecture, so
    # NOTHING IS EMULATED. This repository is public, which is what makes the
    # arm64 hosted runners available at no cost, and that is the whole unlock.
    #
    # The single-host form this replaces built both platforms in one job, so
    # whichever architecture the host was, the other ran under QEMU. Measured on
    # this repo: nccl took 2h38m, and because the matrix gates the merge, one
    # emulated build set the latency of every `runners/` change. The same build
    # native is minutes. A one-line Dockerfile fix costing most of an hour to
    # verify discourages exactly the changes that most need verifying, on images
    # a node's readiness gate executes.
    runs-on: ${{ matrix.host }}
    # Kept well above a native build's needs rather than trimmed to them: this is
    # a backstop against a hung build, not a target. The old 350 existed because
    # QEMU could genuinely run for hours; nothing here should now approach it.
    timeout-minutes: 120
    strategy:
      # One broken runner must not hide the state of the other ten — the whole
      # point of the matrix is to find out which of them build.
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.runner-plan.outputs.runners) }}
        platform: [linux/amd64, linux/arm64]
        # `include` entries that match an existing combination ADD fields to it
        # rather than creating new combinations, which is what maps each platform
        # onto a host of its own architecture.
        include:
          - platform: linux/amd64
            host: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            host: ubuntu-24.04-arm
            arch: arm64
        # clockprobe-rocm builds with the ROCm apt toolchain, which AMD
        # publishes for linux/amd64 only — and every AMD accelerator host that
        # image could measure (Strix Halo APUs, Instinct) is amd64, so an
        # arm64 leg would build an image for a machine that does not exist.
        # Excluded rather than emulated: with no QEMU on these runners the leg
        # would fail at FROM, and emulating it would verify nothing anyway.
        # publish-runner.yml's two-platform assertion must grow the same
        # awareness before that runner is ever published.
        exclude:
          - runner: clockprobe-rocm
            platform: linux/arm64
          - runner: compute-smoke-rocm
            platform: linux/arm64
          - runner: memory-bw-rocm
            platform: linux/arm64
          - runner: nccl-rocm
            platform: linux/arm64
          - runner: thermal-soak-rocm
            platform: linux/arm64
          - runner: gpu-burn-rocm
            platform: linux/arm64
    steps:
      # ── FIRST, before anything pulls a layer ──────────────────────────────────
      # A hosted ubuntu-latest runner has roughly 14 GB free and ships 20-30 GB of
      # preinstalled toolchains nothing here uses. That is not enough for the two
      # heaviest runners: nccl and gpudirect-rdma each pull the ~10 GB CUDA devel
      # image plus a golang stage plus an ubuntu runtime stage, and both failed
      # ~2.5 minutes in with ENOSPC on a SINGLE-platform build. The symptom was an
      # unretrievable log (BlobNotFound), because the runner could not write its
      # own diagnostics — the real message was only in the check annotation:
      #
      #   System.IO.IOException: No space left on device :
      #     '/home/runner/actions-runner/cached/.../_diag/Worker_....log'
      #
      # Two platforms means two full sets of layers for every stage in the same
      # job, so this got strictly worse with the multi-arch change, not better.
      #
      # UNCONDITIONAL rather than gated on the cheap/expensive tier below. That
      # tier is derived from which stages are EMULATED, which is a CPU-time
      # property and not a disk one — a "cheap" runner can still pull a large
      # base image — and publish-runner.yml has no tier at all. One rule in both
      # workflows is cheaper to reason about than two, and ~30 s is far under the
      # cost of the failure it prevents, whose diagnostics are unreadable.
      #
      # Plain shell rather than a marketplace action: this repo pins its
      # dependencies deliberately, and an unpinned third-party action holding
      # `rm -rf` on the runner is a poor trade for fifteen lines of shell.
      #
      # It runs BEFORE `id: started`, so the wall-clock figure reported at the end
      # stays a measurement of the image build and not of this.
      #
      # RECLAIM_PATHS is duplicated verbatim in publish-runner.yml and
      # runners/pins_test.go fails if the two drift.
      - name: Reclaim disk before the image build
        run: |
          set -uo pipefail
          RECLAIM_PATHS='/usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift'
          echo "== df before"; df -h /
          for d in ${RECLAIM_PATHS}; do
            # An absent path is NOT an error. The runner image's contents change
            # between releases, and this step must not become a tripwire on a
            # runner that simply stopped shipping one of these.
            if [ ! -e "$d" ]; then echo "  absent   $d"; continue; fi
            if sudo rm -rf "$d"; then echo "  removed  $d"; else echo "  FAILED   $d"; fi
          done
          # The preloaded container images are several GB and nothing here uses
          # them. This runs before setup-buildx, so it cannot evict a layer or a
          # cache entry this job produced.
          sudo docker system prune -af >/dev/null 2>&1 || true
          echo "== df after"; df -h /

      - uses: actions/checkout@v7

      # NO setup-qemu. Each job builds only its own host's architecture, so there
      # is nothing to emulate — and leaving QEMU installed would let an
      # accidentally cross-platform build succeed slowly instead of failing
      # loudly, which is how the emulation crept back in last time.
      - uses: docker/setup-buildx-action@v4

      - id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.runner }} (${{ matrix.platform }}, native, no push)
        uses: docker/build-push-action@v7
        with:
          context: runners/${{ matrix.runner }}
          # ONE platform, matching the host. Both are still covered — by the other
          # leg of the matrix, on its own native runner. An arm64-only runner image
          # is unusable by every x86 adopter (H100, B200, MI300), which was the
          # single largest barrier to adopting this project, so the coverage is not
          # negotiable; only the emulation is.
          platforms: ${{ matrix.platform }}
          push: false
          # No CUDA_ARCH build-arg, deliberately. It used to pin sm_121a, which
          # is GB10 — a Grace part with no x86 host in existence — so forcing it
          # across a two-platform matrix would build an amd64 image whose device
          # code cannot run on any amd64 machine. The runners that compile device
          # code now default their gencode PER TARGET PLATFORM (compute-smoke:
          # arm64 sm_121a / amd64 sm_120a; nccl: arm64 sm_121 / amd64 sm_90), and
          # leaving the arg unset is what selects those defaults. That is still
          # "build what gets published": publish-runner.yml's cuda_arch input
          # defaults to `default`, which resolves to exactly the same thing.
          #
          # Scoped per runner AND PER PLATFORM. Without the platform in the key
          # the two legs share one scope and evict each other's layers on sight —
          # an amd64 CUDA stage and an arm64 one have nothing in common, so every
          # export would overwrite the other's and both would miss every time.
          # GitHub's Actions cache is 10 GB per REPOSITORY, so the heavy runners
          # will still miss more often than they hit; the cheap ones hit reliably.
          #
          # ignore-error=true because the cache is an optimisation and this job is
          # a GATE: a full-cache or cache-service failure must not be reported as
          # "this runner does not build", which is the one thing the job is here
          # to answer.
          cache-from: type=gha,scope=runner-${{ matrix.runner }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runner }}-${{ matrix.arch }},ignore-error=true
          tags: ghcr.io/baldwinspc/glimmer-burnin-${{ matrix.runner }}:ci-${{ matrix.arch }}

      # Reported so the cost of this matrix is a measurement rather than an
      # estimate, and so the decision above can be revisited from data.
      - name: Report wall-clock
        if: always()
        env:
          # Not RUNNER_* and not GITHUB_*: those prefixes are reserved by Actions
          # and a job-level env cannot override them, so the value silently
          # becomes the Actions runner's own.
          KIND: ${{ matrix.runner }}
          PLATFORM: ${{ matrix.platform }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          secs=$(( $(date +%s) - STARTED ))
          # One platform per job, on a host of its own architecture. If this ever
          # reports "emulated" the matrix has lost its host mapping and the number
          # is not comparable with any other — say so rather than printing a
          # figure that silently means something else.
          case "${PLATFORM}:${RUNNER_ARCH}" in
            linux/amd64:X64|linux/arm64:ARM64) how=native ;;
            *) how="EMULATED (${PLATFORM} on ${RUNNER_ARCH})" ;;
          esac
          printf '### `%s` %s — %dm %02ds (%s)\n' \
            "$KIND" "$PLATFORM" "$((secs / 60))" "$((secs % 60))" "$how" >> "$GITHUB_STEP_SUMMARY"
