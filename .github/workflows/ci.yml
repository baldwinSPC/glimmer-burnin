name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the toolchain from go.mod so CI and local builds never drift.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then echo "gofmt needed on:"; echo "$fmt"; exit 1; fi

      - name: Test
        run: go test ./... -count=1

      # The standalone invariant: this OSS operator must never depend on the
      # private Glimmer control plane. Integration is via BurnInSink only.
      - name: No Glimmer import (standalone guard)
        run: |
          if grep -rn --include='*.go' 'baldwinSPC/glimmer\(/\|"\)' . ; then
            echo "::error::glimmer-burnin must not import the Glimmer control plane — integrate via BurnInSink"
            exit 1
          fi
          echo "standalone: no glimmer import found"

      - name: CRD/deepcopy drift check
        # Informational for now — tighten to a hard gate once the generation
        # baseline is confirmed stable across environments.
        continue-on-error: true
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 object:headerFile=hack/boilerplate.go.txt paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2 crd rbac:roleName=burnin-manager-role webhook paths=./... output:crd:artifacts:config=config/crd output:rbac:artifacts:config=config/rbac
          git diff --exit-code api/ config/ || { echo "::error::generated code/manifests are stale — run 'make generate manifests' and commit"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          tags: ghcr.io/baldwinspc/glimmer-burnin:ci

  # The compute-smoke runner compiles CUTLASS for sm_121a, which only makes sense
  # for linux/arm64 (GB10). On an amd64 runner that means QEMU emulation, and a
  # CUTLASS template build under emulation is slow (minutes, not seconds) — so this
  # is opt-in rather than part of every PR. Build-only: publishing is a deliberate,
  # separately-approved step.
  runner-compute-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build compute-smoke runner (linux/arm64, no push)
        uses: docker/build-push-action@v6
        with:
          context: runners/compute-smoke
          platforms: linux/arm64
          push: false
          tags: ghcr.io/baldwinspc/glimmer-burnin-compute-smoke:ci
