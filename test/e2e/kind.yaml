# The cluster the e2e suite runs on.
#
# Three nodes, and the count is load-bearing rather than generous:
#
#   * the control plane hosts the operator. It is deliberately NOT a burn-in
#     target — the manager must keep reconciling while the nodes under test are
#     cordoned, and config/manager/manager.yaml tolerates both the control-plane
#     taint and the operator's own cordon so that stays true;
#   * TWO workers, because Pair scope is one execution across two DISTINCT
#     nodes. A single-worker cluster cannot express a link test at all, and the
#     Pair rendezvous — a headless Service, per-pod DNS, and the ready gate
#     between server and client — is the path that shipped broken against a
#     ClusterRole with no `services` rule.
#
# Both workers are real kind nodes, so the scheduler places pods on them for
# real. That is the whole point: the cordon deadlock (a cordoned node plus a pod
# that does not tolerate the cordon) is invisible to anything that does not run
# a scheduler.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
