metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: burnintests.burnin.glimmer.ai
spec:
  group: burnin.glimmer.ai
  names:
    categories:
    - burnin
    kind: BurnInTest
    listKind: BurnInTestList
    plural: burnintests
    shortNames:
    - bit
    singular: burnintest
  scope: Namespaced
  versions:
