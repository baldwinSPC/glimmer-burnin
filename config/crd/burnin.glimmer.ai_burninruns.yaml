    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BurnInRun is one execution of a BurnInProfile against a target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BurnInRunSpec is one execution of a BurnInProfile against
              a target.
            properties:
              profileRef:
                description: ProfileRef names the BurnInProfile to run (same namespace).
                type: string
              target:
                description: Target selects the node(s) under test.
                properties:
                  nodeNames:
                    description: |-
                      NodeNames explicitly names nodes. For a Pair-scope profile exactly two are
                      required; the operator pairs them for the point-to-point tests.
                    items:
                      type: string
                    type: array
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector selects nodes by label (e.g. glimmer.ai/interconnect=roce-200g).
                    type: object
                  tolerations:
                    description: Tolerations applied to every test pod so it can land
                      on tainted GPU nodes.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists and Equal. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                type: object
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished garbage-collects the run (and its pods) this long
                  after it reaches a terminal phase. 0 keeps it.
                format: int32
                type: integer
            required:
            - profileRef
            - target
            type: object
          status:
            description: BurnInRunStatus tracks execution and the exported verdict.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failed:
                format: int32
                type: integer
              fingerprint:
                additionalProperties:
                  type: string
                description: |-
                  Fingerprint is the NodeFingerprint captured at run start (what hardware
                  this verdict actually applies to).
                type: object
              finishedAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              passed:
                format: int32
                type: integer
              phase:
                default: Pending
                description: RunPhase is the lifecycle of a BurnInRun.
                enum:
                - Pending
                - Running
                - Passed
                - Failed
                - Error
                - Cancelled
                type: string
              results:
                items:
                  description: TestResult is the outcome of one test within a run.
                  properties:
                    finishedAt:
                      format: date-time
                      type: string
                    kind:
                      description: |-
                        TestKind is a well-known category. The kind selects the default runner image
                        and result parser; Runner may override the image. Unknown kinds are allowed
                        (custom runners) but get no built-in parsing.
                      type: string
                    message:
                      description: Message is a human-readable outcome (a failing
                        threshold, the real error).
                      type: string
                    metrics:
                      additionalProperties:
                        type: string
                      description: |-
                        Metrics are the parsed numeric results the thresholds were evaluated
                        against (e.g. busBandwidthGBs: "23.4", eccErrors: "0").
                      type: object
                    name:
                      type: string
                    nodes:
                      items:
                        type: string
                      type: array
                    phase:
                      description: RunPhase is the lifecycle of a BurnInRun.
                      enum:
                      - Pending
                      - Running
                      - Passed
                      - Failed
                      - Error
                      - Cancelled
                      type: string
                    scope:
                      description: |-
                        TestScope is the topology a test exercises.

                        Pair (and Group) scope is first-class in v1: acceptance of an interconnect —
                        NCCL over RoCE/IB, ib_write_bw, GPUDirect — is only meaningful across at least
                        two nodes, so the operator schedules and correlates multi-node tests, not just
                        per-node ones.
                      enum:
                      - Node
                      - Pair
                      - Group
                      type: string
                    startedAt:
                      format: date-time
                      type: string
                  required:
                  - kind
                  - name
                  - phase
                  - scope
                  type: object
                type: array
              sinkStatus:
                additionalProperties:
                  type: string
                description: SinkStatus records the last export attempt per sink.
                type: object
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
