  names:
    categories:
    - burnin
    kind: BurnInRun
    listKind: BurnInRunList
    plural: burninruns
    shortNames:
    - bir
    singular: burninrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef
      name: Profile
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.passed
