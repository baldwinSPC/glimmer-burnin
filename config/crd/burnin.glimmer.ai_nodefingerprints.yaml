---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: nodefingerprints.burnin.glimmer.ai
spec:
  group: burnin.glimmer.ai
  names:
    categories:
    - burnin
    kind: NodeFingerprint
    listKind: NodeFingerprintList
    plural: nodefingerprints
    shortNames:
    - nfp
    singular: nodefingerprint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.digest
      name: Digest
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeFingerprint is the captured hardware/network identity of
          a node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeFingerprintSpec selects the node whose hardware identity
              is captured.
            properties:
              nodeName:
                description: NodeName is the node this fingerprint describes.
                type: string
            required:
            - nodeName
            type: object
          status:
            description: |-
              NodeFingerprintStatus is the captured identity — the baseline a burn-in
              verdict is bound to, and the drift detector between runs.
            properties:
              capturedAt:
                description: |-
                  CapturedAt is when this identity was last OBSERVED TO CHANGE, not when it
                  was last looked at. A field that moved on every reconcile would make
                  every node's fingerprint churn on every node heartbeat, and would say
                  nothing.
                format: date-time
                type: string
              conditions:
                description: Conditions carries the drift signal; see ConditionNodeFingerprintDrifted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              digest:
                description: |-
                  Digest is a stable hash of the salient hardware identity; a change between
                  runs means the hardware under a prior verdict is no longer the same.

                  It is written as "<scheme>:<hex>". The scheme prefix exists so that a
                  change to WHAT the operator considers salient is distinguishable from a
                  change to the hardware itself: digests of different schemes are not
                  comparable, and an incomparable pair is never reported as drift.
                type: string
              gpus:
                items:
                  description: GPUInfo is one accelerator as observed on the node.
                  properties:
                    arch:
                      type: string
                    driverVersion:
                      type: string
                    index:
                      format: int32
                      type: integer
                    memoryBytes:
                      format: int64
                      type: integer
                    model:
                      type: string
                    vendor:
                      type: string
                  required:
                  - index
                  type: object
                type: array
              kernel:
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels is the HARDWARE-IDENTITY subset of the node's labels, not a copy
                  of all of them. Copying every label would fold scheduling state, taints,
                  topology and — worst — the burn-in verdict labels this operator's own
                  consumers write onto nodes into the digest, so the operator would report
                  hardware drift in response to its own writes.
                type: object
              nics:
                items:
                  description: |-
                    NICInfo is one fabric-relevant network interface. It mirrors the vendor-
                    neutral classification a node probe produces (management vs fabric, RDMA
                    device, link layer) without importing any external inventory package.
                  properties:
                    linkLayer:
                      type: string
                    model:
                      type: string
                    mtu:
                      format: int32
                      type: integer
                    name:
                      type: string
                    pciVendor:
                      type: string
                    rdmaDevice:
                      type: string
                    role:
                      type: string
                    speedMbps:
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              osImage:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
