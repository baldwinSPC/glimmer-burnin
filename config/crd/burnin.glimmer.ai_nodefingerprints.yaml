---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: nodefingerprints.burnin.glimmer.ai
spec:
  group: burnin.glimmer.ai
  names:
    categories:
    - burnin
    kind: NodeFingerprint
    listKind: NodeFingerprintList
    plural: nodefingerprints
    shortNames:
    - nfp
    singular: nodefingerprint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.digest
      name: Digest
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeFingerprint is the captured hardware/network identity of
          a node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeFingerprintSpec selects the node whose hardware identity
              is captured.
            properties:
              nodeName:
                description: NodeName is the node this fingerprint describes.
                type: string
            required:
            - nodeName
            type: object
          status:
            description: |-
              NodeFingerprintStatus is the captured identity — the baseline a burn-in
              verdict is bound to, and the drift detector between runs.
            properties:
              capturedAt:
                format: date-time
                type: string
              digest:
                description: |-
                  Digest is a stable hash of the salient hardware identity; a change between
                  runs means the hardware under a prior verdict is no longer the same.
                type: string
              gpus:
                items:
                  description: GPUInfo is one accelerator as observed on the node.
                  properties:
                    arch:
                      type: string
                    driverVersion:
                      type: string
                    index:
                      format: int32
                      type: integer
                    memoryBytes:
                      format: int64
                      type: integer
                    model:
                      type: string
                    vendor:
                      type: string
                  required:
                  - index
                  type: object
                type: array
              kernel:
                type: string
              labels:
                additionalProperties:
                  type: string
                type: object
              nics:
                items:
                  description: |-
                    NICInfo is one fabric-relevant network interface. It mirrors the vendor-
                    neutral classification a node probe produces (management vs fabric, RDMA
                    device, link layer) without importing any external inventory package.
                  properties:
                    linkLayer:
                      type: string
                    model:
                      type: string
                    mtu:
                      format: int32
                      type: integer
                    name:
                      type: string
                    pciVendor:
                      type: string
                    rdmaDevice:
                      type: string
                    role:
                      type: string
                    speedMbps:
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              osImage:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
