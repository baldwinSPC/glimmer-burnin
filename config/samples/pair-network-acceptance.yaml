# A pair-scope network acceptance profile: prove the RDMA interconnect between
# two Sparks before trusting the cluster for multi-node training.
#
# ─── HOW PAIR SCOPE EXECUTES ──────────────────────────────────────────────────
#
# The operator runs a SERVER pod on the first target node and a CLIENT pod on
# the second, each pinned to its node, rendezvous'd through a headless Service.
# The client is not started until the server pod is Ready. Both containers get
# BURNIN_ROLE=server|client, BURNIN_PEER_HOST (the peer's DNS name) and
# BURNIN_PEER_NODE alongside BURNIN_DURATION_SECONDS.
#
# The pair produces ONE result naming BOTH nodes. A point-to-point measurement
# is a property of the link, so a failure here indicts the LINK — cable,
# transceiver, switch port, NIC, either end — and is deliberately not attributed
# to one node.
#
# Two requirements this sample satisfies explicitly, both refused at run start
# with an explanation rather than discovered at the deadline:
#
#   * exactly two distinct target nodes;
#   * maxConcurrentNodes >= 2, because a pair holds BOTH of its nodes for the
#     whole test and therefore costs two slots of the facility interlock. The
#     default of 1 cannot admit a pair at all.
#
# ─── THE RUNNER IMAGES: THIS PROFILE RUNS ─────────────────────────────────────
#
# APPLYING THIS IS NOT A NO-OP. Both kinds below — nccl and ib-write-bw — now
# resolve to published default images, so a run cordons the two named nodes,
# holds BOTH for the whole test (a pair costs two interlock slots), and puts
# real RDMA and collective load on them.
#
# This header said the opposite until #299: it claimed neither runner shipped,
# so the profile settled as a plan-time Error and was safe to apply blind. That
# was true when it was written and the release invalidated it. Nothing about the
# statement looked stale, which is why a guard now checks it —
# TestSamplesAgreeWithTheRunnerImageTable in pkg/runnerimages.
#
# Each test below still carries a spec.runner block with NO image in it, and now
# for one reason rather than two: the block exists for the /dev/infiniband
# mount, and an unset image takes the pinned default.
#
# KINDS THAT STILL NEED AN EXPLICIT spec.runner.image (generated — do not edit
# by hand; the guard above compares this line against runnerimages.WithoutDefault):
#   custom, fabric-soak, fingerprint-probe, memory-retention, power-swing, xpu-diag
#
# ─── WHY /dev/infiniband IS MOUNTED, AND THE REAL RLIMIT TRAP ─────────────────
#
# The mount makes the RDMA device dependency EXPLICIT rather than relying on
# `privileged: true` to hand the container the host's whole /dev. It is not
# what fixed fabric qualification, and an earlier revision of this comment said
# it was — that was a misdiagnosis, corrected here. Re-measured on these nodes,
# a privileged pod sees uverbs0-3 with or without the mount; only by-ibdev and
# by-path differ. Declaring the mount is still worth doing: it documents intent
# and survives a future tightening of the privileged path.
#
# BUT THE MOUNT IS NOT A SUBSTITUTE FOR `privileged`, and this sample used to
# set neither. The sentence above is about what a PRIVILEGED pod sees; it says
# nothing about an unprivileged one, and an unprivileged one cannot open these
# devices at all. `/dev/infiniband/uverbs*` are CHARACTER DEVICES, and a
# Kubernetes hostPath volume grants visibility, never a device-cgroup rule —
# the same finding as #302 for /dev/kmsg, on a different device. Measured on
# these nodes 2026-08-17, applying this sample unmodified:
#
#   IB_WRITE_BW_ERROR: bw phase: ib_write_bw did not begin listening on 18515
#   (output: Couldn't get context for the device)
#
# So both are required and neither alone is sufficient: the mount to see the
# nodes, `privileged` to open them.
#
# ─── AND WHY hostNetwork IS REQUIRED, WHICH IS LESS OBVIOUS ───────────────────
#
# rdma.go picks the RDMA device from THE ROUTE TO THE PEER, deliberately,
# because the same cable lands on roceP2p1s0f1 at one end and roceP2p1s0f0 at
# the other — port numbering is not symmetric across a link, so a hard-coded
# device measures the right link from one node and a dead port from the other.
#
# That question can only be answered in the HOST network namespace. Inside a
# pod, the route to the peer is the CNI veth, which is not a fabric interface;
# selectPort finds no answer, falls back, and both ends pick their first RDMA
# device — which on a fleet cabled like this one are two ports on DIFFERENT
# links. The queue pair then cannot reach RTR and the symptom is
# indistinguishable from a bad link:
#
#   Failed to modify QP 475 to RTR / Unable to Connect the HCA's through the link
#
# With `hostNetwork: true` and `privileged: true` the same two nodes measured
# 99.63 Gbps at 1.58 us, and nccl 11.63 GB/s Pair / 11.97 GB/s Group. Neither
# field is a preference; both are preconditions for what these runners do.
# fabric-soak.yaml and tcp-baseline.yaml already set hostNetwork — this sample
# was the odd one out. See #381.
#
# THE ACTUAL BLOCKER WAS `RLIMIT_MEMLOCK`, and it is worth understanding because
# it will bite any RDMA workload on this cluster, not just burn-in.
#
# RDMA buffers are pinned memory. perftest registers size x qps x 2, so
# `-s 1048576 -q 4` needs exactly 8 MiB. containerd's systemd unit ships
# LimitMEMLOCK=8388608 (8 MiB), inherited by every pod — so registration lands
# precisely on the ceiling and ibv_create_cq returns ENOMEM, surfacing as the
# thoroughly unhelpful "Couldn't create CQ / Failed to create CQs / Couldn't
# create IB resources". NCCL hits the same wall as "ibv_reg_mr_iova2 failed
# with error Cannot allocate memory".
#
# The bisection that proved it: `-s 1M` alone passes, `-q 4` alone passes, both
# together fail. Each halves to fit; the product does not.
#
# Note `securityContext.capabilities.add: [IPC_LOCK]` does NOT help a non-root
# container — Kubernetes has no ambient-capabilities field, so runc clears the
# permitted set and CapPrm/CapEff read as all zeros. CAP_IPC_LOCK *bypasses*
# RLIMIT_MEMLOCK, which is why the same run passes as uid 0 and fails as uid
# 65532 at the identical limit. The fixes are therefore: raise the limit on the
# node (a containerd drop-in with LimitMEMLOCK=infinity), or run the pod as
# root. The ib-write-bw runner additionally right-sizes itself to whatever
# limit it observes, so it degrades to a smaller message size instead of dying.
#
# When adopting a runner, note that perftest (ib_write_bw) must be invoked with
# --report_gbits: it reports MB/s by default, and a bytes-vs-bits mixup shifts
# bandwidthGbps by 8x. See config/samples/node-acceptance.yaml for a profile
# that runs end to end today.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: ib-write-bw
spec:
  kind: ib-write-bw
  scope: Pair
  durationSeconds: 60
  # Required, not preferred: rdma.go selects its device from the route to the
  # peer, and that route is only answerable in the host netns. See the header.
  hostNetwork: true
  runner:
    # Required to OPEN the uverbs character devices; the mount only makes them
    # visible. See the header.
    privileged: true
    # No image on purpose — see the header. This block exists for the mount.
    #
    # The mount is applied to BOTH pods of the pair, server and client alike: a
    # link measured from only one end is not measured.
    hostPaths:
      - path: /dev/infiniband
        mountPath: /dev/infiniband
        # WRITABLE, and this one has to be said out loud because readOnly
        # defaults to true. ibv_open_device opens the uverbs nodes read-write,
        # so a read-only mount fails in the same place as no mount at all.
        readOnly: false
        # A node in a fabric-qualification run with no /dev/infiniband has not
        # loaded its RDMA drivers. That is an infrastructure fault, so refusing
        # the pod (recorded as Error — unjudged) is the right answer; the
        # operator will not create the path to paper over it.
        type: Directory
  thresholds:
    # MEASURED, not derived from line rate. On 2026-08-02, ib_write_bw between
    # two GB10 Sparks over RoCE plateaued at 99.63 Gb/s — identical at 4 and 8
    # queue pairs with 1 MiB messages, so it is a real ceiling and not a
    # single-QP artifact. The Ethernet link genuinely negotiates 200000 Mb/s;
    # the limit is the ConnectX-7's host attachment, PCIe Gen5 x4, where
    # current_link_* == max_link_* (nothing is degraded). Gen5 x4 is ~15.75 GB/s
    # raw, ~100 Gb/s after overhead. The wire is 200G; the host can only feed
    # half of it. This is architectural on DGX Spark, not a fault.
    #
    # The obvious "~90% of 200GbE line rate" value of 180 is therefore wrong by
    # ~2x and would fail every healthy Spark pair. 89 is ~90% of the measured
    # ceiling. Re-measure before reusing this number on any other SKU.
    - metric: bandwidthGbps
      comparison: GreaterThanOrEqual
      value: "89"
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: nccl-allreduce-pair
spec:
  kind: nccl
  scope: Pair
  durationSeconds: 120
  hostNetwork: true
  resources:
    limits:
      nvidia.com/gpu: "1"
  runner:
    privileged: true
    # Same mount, same reason: NCCL's net_ib plugin goes through the verbs
    # layer, so without uverbs* it fails to create its resources exactly as
    # ib_write_bw does — and an RDMA plugin that cannot initialise falls back to
    # TCP, which produces a plausible bandwidth number for a path nobody was
    # qualifying. An RDMA device request alone does not supply the device nodes.
    hostPaths:
      - path: /dev/infiniband
        mountPath: /dev/infiniband
        readOnly: false
        type: Directory
  # RAISED FROM 10.8 — issue #489. The reasoning below that set 10.8 was wrong,
  # not just imprecise: it treated ~12.45 GB/s (the SINGLE-rail ib_write_bw
  # ceiling on this link) as the hard upper bound for a 2-rank all-reduce. This
  # fleet has TWO usable collective rails, not one, and #489 found that
  # selectPort's route-to-peer fallback was silently picking exactly one of
  # them — the cluster/etcd-peer cable, not either collective rail — so every
  # run to date measured a real but WRONG-TOPOLOGY number, and 10.8 (~90% of
  # that same single-rail figure) was satisfied by the wrong measurement just
  # as readily as by a correct one. Nothing here caught it.
  #
  # 19.913 is threshold_basis pcie-budget-collective: 0.80 x the collective's
  # summed per-rail PCIe budgets, each bounded by line rate — the same formula
  # already shipped and hardware-verified on this exact fleet (measured
  # 22.652 GB/s against this floor) in the sibling system that found and fixed
  # the identical single-rail-fallback defect first (rail_netdevs(), cited in
  # #489). Two rails at the ~12.45 GB/s single-rail PCIe ceiling measured above
  # sum to ~24.9 GB/s before the 0.80 margin, which is the same arithmetic
  # landing in the same place from this project's own numbers.
  #
  # #489's OTHER HALF — nccl's own rdma.go now tries multi-rail selection
  # first (classifyRails: pin every RDMA port sharing a local subnet with
  # >= 1 other, the collective rail) and falls back to the original
  # single-device selectPort only when no such subnet exists or the
  # candidate rails' GID indices disagree. A healthy pair on this fleet
  # should now clear this floor comfortably at ~22.6+ GB/s. If a run instead
  # measures the old single-rail figure (~11.99-12.00 GB/s) and fails this
  # gate, that is EITHER the fallback path firing for a real reason (worth
  # reading the run's log for classifyRails' own explanation) OR a genuine
  # single-rail regression — either way the floor is doing its job: a
  # single-rail measurement must not certify as this fleet's collective
  # bandwidth, which is the whole point of raising it in the first place.
  # Re-measure this number if it is ever reused for a different rail count
  # or a different SKU's PCIe attachment — see #489 and its prior-art
  # citation for the derivation.
  thresholds:
    - metric: busBandwidthGBs
      comparison: GreaterThanOrEqual
      value: "19.913"
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInProfile
metadata:
  name: pair-network-acceptance
spec:
  failFast: false
  tests:
    - testRef: ib-write-bw
    - testRef: nccl-allreduce-pair
  sinks:
    - results-webhook
---
# Export verdicts to your own system with no code dependency — a plain webhook POST.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInSink
metadata:
  name: results-webhook
spec:
  type: Webhook
  webhook:
    # Your own endpoint. The envelope a receiver has to handle is documented
    # in docs/sinks.md. Delivery is AT-LEAST-ONCE with a DeliveryID stable
    # across retries, so the receiver dedupes on that key rather than the
    # operator promising exactly-once — a promise no sender can keep.
    url: https://results.example.com/api/v1/burnin
    tokenSecretRef:
      name: burnin-webhook-token
      key: token
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInRun
metadata:
  name: pair-link-check
spec:
  profileRef: pair-network-acceptance
  ttlSecondsAfterFinished: 3600
  # A pair is one indivisible unit of load holding BOTH of its nodes, so it
  # needs two of the interlock's slots and cannot start at the default of 1.
  # Raising this is a facility decision: two nodes at full load is two nodes'
  # worth of power and heat. For a fabric test that is a modest ask compared to
  # gpu-burn, but the number still has to be set deliberately.
  maxConcurrentNodes: 2
  target:
    # Exactly two, and distinct. The first is the server (rank 0), the second is
    # the client — which is the side that measures, and therefore the side whose
    # metrics decide the verdict.
    nodeNames:
      - node-a
      - node-b
