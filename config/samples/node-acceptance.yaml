# Single-node acceptance. Every test here is Node scope; see
# pair-network-acceptance.yaml for the Pair-scope suite, which now executes too
# — it was recorded as Error when this line was written, and both statements
# went stale at the same release (#299).
#
# ─── RUNNER IMAGES ────────────────────────────────────────────────────────────
#
# APPLYING THIS FILE PUTS REAL LOAD ON THE NODES IT NAMES. Most kinds below now
# resolve to published default images, so their pods pull, the run cordons each
# target as it reaches it, and the hardware is exercised.
#
# This header said the opposite until #299 — "only compute-smoke has a published
# image ... those tags are not in the registry yet" — which was true when it was
# written and stopped being true at a release. A reader had no way to tell it had
# expired, so a guard now checks it against the table rather than trusting the
# prose: TestSamplesAgreeWithTheRunnerImageTable in pkg/runnerimages.
#
# A kind with no default still reports a plan-time infrastructure Error, never a
# hardware verdict, naming the kind and asking for spec.runner.image. Point that
# at your own build to run one.
#
# KINDS THAT STILL NEED AN EXPLICIT spec.runner.image (generated — do not edit
# by hand; the guard above compares this line against runnerimages.WithoutDefault):
#   custom, fabric-soak, fingerprint-probe
#
# ─── THRESHOLDS FAIL CLOSED ───────────────────────────────────────────────────
#
# A threshold naming a metric the runner did not emit is a FAILURE, not a pass.
# These runners deliberately omit a reading they could not take rather than
# reporting a confident zero, so a threshold is also an assertion that the
# measurement was possible at all. Where that is load-bearing it is called out
# in a comment below.
#
# There is exactly one way to relax that, and only the runner can invoke it: a
# runner that looked at the hardware and found there is nothing to measure emits
# the reserved value `n/a`, and a threshold marked
# `applicability: RequiredIfMeasurable` is then reported as NOT EVALUATED
# instead of failing. Omission is still a failure — a runner that crashed before
# emitting has not declared anything — so this cannot turn a broken probe into a
# pass. See the host-fault-counters test at the bottom of this file.
#
# ─── MULTI-DEVICE COVERAGE ────────────────────────────────────────────────────
#
# resources.limits.nvidia.com/gpu below is set to "1" throughout this file
# because that is GB10's real board size (one Grace-Blackwell superchip per
# node) — the fleet every threshold in this file was actually measured
# against — not because "1" is a safe default. The Kubernetes device plugin
# injects exactly as many devices as this number requests, so on a
# MULTI-GPU SKU it must be raised to that SKU's real count (see
# fingerprint-probe's acceleratorCount metric for what a given node
# actually has) or a test silently measures one card and calls it the node.
#
# compute-smoke and clockprobe (docs/dev/multi-device.md) measure every
# device they were allocated, and their tests below gate `deviceCount Equal
# 1` for exactly that reason: a partial allocation is a config error, and
# the gate turns it into a visible FAILURE instead of a quiet undercount.
# dcgm-diag, memory-bw and host-health do not yet claim `deviceCount` (some
# by design, some pending #431) and carry no such gate — see each test's own
# resources.limits comment for which applies.

# compute-smoke is a BURST, and there is deliberately no durationSeconds here.
#
# It runs one block-scaled NVFP4 GEMM and checks it against a host reference, in
# milliseconds. What it proves is that the real FP4 tensor-core instruction path
# executed on this part and got the right answer — a correctness statement, which
# holding the same GEMM in a loop for two minutes would not strengthen.
#
# This file used to ask for `durationSeconds: 120` and silently get milliseconds,
# which made the sample fiction (issue #25). The duration-bearing kinds are the
# ones below: thermal-soak and gpu-burn hold a load for their whole budget, and
# clockprobe holds one specifically to judge sustained clocks. One kind, one job.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: fp4-compute-smoke
spec:
  kind: compute-smoke
  scope: Node
  thresholds:
    - metric: nonfiniteCount
      comparison: Equal
      value: "0"
    # deviceCount is the gate a PARTIAL allocation trips. compute-smoke
    # measures every device the pod was allocated (docs/dev/multi-device.md),
    # not device 0 alone — but it can only measure what the device plugin
    # actually injects, which is bounded by resources.limits below. "1" here
    # is GB10's real board size, the fleet this whole file is measured
    # against (one Grace-Blackwell superchip per node) — on a multi-GPU SKU,
    # set this to fingerprint-probe's acceleratorCount metric, which says
    # what a given node actually has, and change resources.limits to match.
    # A pod handed one card on an eight-GPU node would otherwise certify one
    # card as the node, with nothing here to fail that pod instead.
    - metric: deviceCount
      comparison: Equal
      value: "1"
  resources:
    limits:
      # "1" is GB10's own board size, not an arbitrary placeholder — see the
      # deviceCount gate above. Requesting the whole board is what that gate
      # depends on: the device plugin injects exactly as many devices as this
      # number asks for, so under-requesting silently limits coverage no
      # matter how many accelerators the node actually has.
      nvidia.com/gpu: "1"
---
# The clock gate. This is the one that catches a part pinned in a low P-state:
# it reports healthy utilization, passes every other test in this profile, and
# simply produces a fraction of the work forever. On GB10 it is the USB-C
# Power-Delivery failure mode.
#
# The gate belongs on the PERCENTAGE, not on smClockMHz: the absolute clock is
# SKU-specific and a fleet-wide threshold on it would have to be retuned for
# every part number. The runner exits 2 (skip) where it cannot read a rated
# clock, so a part with no nameplate is unjudged rather than failed.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: sustained-clock
spec:
  kind: clockprobe
  scope: Node
  durationSeconds: 300
  thresholds:
    # MEASURED on GB10, and the obvious value of 90 is wrong — it would fail
    # healthy hardware, which is the exact defect class this project keeps
    # tripping over.
    #
    # Sustained clock is both DURATION- and LOAD-dependent. Under a GEMM load a
    # healthy Spark holds 83.22% of its 3003 MHz rated boost at 25s and decays
    # to 69.90% by 600s, settling on a discrete P-state. clockprobe's own FMA
    # chain holds ~83% because it never touches memory, but this test runs for
    # 300s, so a 90 gate fails a perfectly good node.
    #
    # Critically, all of that happens with zero throttle reasons reported, so
    # throttleEvents below is the real thermal verdict and this gate is a
    # WEDGE BACKSTOP, not a performance gate.
    #
    # 70 was set by the healthy-hardware measurement above and by nothing
    # else — which turned out to BE the bug (#455). Six qual-pass
    # measurements on both Sparks (2026-08-23), spanning a mid-campaign run,
    # an immediate repeat and a genuine cold start (idle 48-49C beforehand),
    # all read EXACTLY 69.70% — zero variance, throttleEvents=0 and
    # throttleReasonsMask=0 on every one, so this is the real, deterministic
    # steady state at 300s and not noise or a thermal artifact. 70 was
    # therefore already inside the healthy minimum's own noise floor before
    # that data existed, and every node in the fleet failed this gate,
    # forever, regardless of health.
    #
    # 65 leaves ~4.7pp of real margin below the measured 69.70% — enough to
    # tolerate normal cross-fleet variance and, per #456's memory-bandwidth
    # finding on this SAME hardware the SAME night (~13% drift attributed to
    # a driver/firmware change over 20 days), enough to not assume today's
    # reading is permanently exact either. It is still a large margin above
    # the wedge estimate below, so a genuinely wedged part is in no danger of
    # passing.
    #
    # Where a wedged part actually sits is NOT measured: this project ESTIMATES
    # near 20% of rated boost, from a researched pin point of ~611 MHz over the
    # measured 3003 MHz rated boost (611/3003 = 20.3%), which agrees in order of
    # magnitude with GEP-0178's independent "~4x slow at 96% utilization" but has
    # never been confirmed against wedged silicon (issue #61). Treat it as the
    # reason this gate has slack rather than as a calibration input — if the
    # estimate is optimistic the gate still fires, and if you tighten toward it
    # you are trading healthy nodes for a number nobody took.
    - metric: sustainedClockPct
      comparison: GreaterThanOrEqual
      value: "65"
    # Transitions into a capped state, not a sample count. An idle GPU is
    # excluded from this by the runner — unloaded is not throttled.
    - metric: throttleEvents
      comparison: Equal
      value: "0"
    # See fp4-compute-smoke's deviceCount gate above for why this exists:
    # clockprobe measures every device it was allocated, and the gate is what
    # turns a partial allocation into a FAILURE instead of a quiet undercount.
    - metric: deviceCount
      comparison: Equal
      value: "1"
  resources:
    limits:
      # "1" is GB10's own board size — see fp4-compute-smoke above.
      nvidia.com/gpu: "1"
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: dcgm-diagnostics
spec:
  kind: dcgm-diag
  scope: Node
  durationSeconds: 600
  # THIS IMAGE SHIPS NO DCGM, so without these mounts the test cannot judge
  # anything: the runner exits 3 with "the DCGM client (\"dcgmi\") is not
  # executable on PATH, so this node is unjudged". That is correct behaviour and
  # it is also a wasted burn-in slot, and this sample used to produce it on the
  # very fleet it was written for (#349).
  #
  # NVIDIA's DCGM binaries carry a licence that grants installation and use but
  # no right to redistribute, so the site supplies the tree and the test points
  # at it. /opt/dcgm-runtime is where the Spark fleet keeps it; change the two
  # `path:` values to wherever yours lives.
  #
  # Both mounts are needed. The second is not a convenience: DCGM 4 looks for
  # its diagnostic plugins under an ABSOLUTE /usr/libexec/datacenter-gpu-manager-4,
  # so mounting only the first gives a dcgmi that starts and then finds no
  # plugins to run.
  #
  # DCGM ALSO GATES SUBTESTS PER SKU, on top of the mount above. Measured on a
  # GB10 (#435): with no override at all, DCGM's own allowlist skips BOTH
  # `memory` and `pcie`, running only `targeted_stress` — this test then
  # ERRORS ("2 of 3 DCGM subtests were SKIPPED") rather than silently passing
  # a partial check. The error message names the fix
  # (BURNIN_DCGM_ALLOW=<plugin>,...), left as a runner.env entry for you to add
  # rather than baked in here: which subtests your SKU actually supports is a
  # fleet fact this sample cannot know, and `memory` genuinely works on
  # hardware with a discrete GPU memory bank, which GB10's unified LPDDR5X
  # does not have — forcing it off here would quietly weaken the check on every
  # OTHER SKU that copies this file.
  runner:
    hostPaths:
      - path: /opt/dcgm-runtime
        mountPath: /usr/local/dcgm
        # The image's PATH and LD_LIBRARY_PATH already lead here, so nothing
        # else needs configuring — lay the tree out as bin/ and lib/.
        readOnly: true
        # Assert-only: the kubelet will not create it. A node without DCGM
        # should fail and say so, not have an empty directory invented for it.
        type: Directory
      - path: /opt/dcgm-runtime/libexec
        mountPath: /usr/libexec/datacenter-gpu-manager-4
        readOnly: true
        type: Directory
  thresholds:
    - metric: diagTestsFailed
      comparison: Equal
      value: "0"
    # A DCGM WARNING PASSES THIS NODE UNLESS YOU GATE IT.
    #
    # dcgm-diag deliberately does not promote a warning to a failure: it did not
    # cross DCGM's own failure line, and the runner measures while the profile
    # decides. The consequence is that `Warn` subtests exit 0, so this is the
    # decision — uncomment to treat any warning as unacceptable:
    #
    #   - metric: testsWarned
    #     comparison: Equal
    #     value: "0"
    #
    # Left off by default because a warning is genuinely weaker evidence than a
    # failure, and a fleet that rejects on every one will reject working parts.
    # It is commented rather than absent so the choice is visible: `diagTestsFailed
    # Equal 0` alone accepts a node DCGM warned about, and that should be
    # something you decided rather than something you inherited. When it trips,
    # `diag_warn_findings` carries what DCGM actually said.
    #
    # No xidEvents gate here, deliberately. This test carried one, and it could
    # not do what it looked like it did: dcgm-diag derived xidEvents by
    # subtracting two readings of DCGM_FI_DEV_XID_ERRORS, which holds the last
    # Xid CODE rather than a count — so a GPU sitting at Xid 79 for the whole
    # window reported 79-79 = 0 and PASSED this gate (#311).
    #
    # The Xid gate that works is on the host-health test below, where the count
    # comes from /dev/kmsg. dcgm-diag now reports lastXidCode as evidence, and
    # the registry marks that ThresholdUse: Evidence because the field is
    # lifetime-scoped: a non-zero code may name an Xid from weeks before this
    # run, so gating on it would condemn a node for history the test never
    # observed.
  resources:
    limits:
      # "1" is GB10's own board size, not an arbitrary placeholder — see
      # fp4-compute-smoke above; on a multi-GPU SKU use
      # fingerprint-probe's acceleratorCount instead. dcgm-diag is a
      # node-wide, read-only diagnostic (it enumerates and diagnoses every
      # device the DRIVER exposes, not just what device_fold.h would fold),
      # but it can still only see what the device plugin injects into this
      # pod: requesting one GPU on an eight-GPU node has dcgmi diagnose one
      # card and call it the node. No deviceCount gate here — this kind
      # reports devicesVisible, not deviceCount
      # (runners/devicefold_test.go's EXEMPT list), so a deviceCount
      # threshold would fail closed on every run.
      nvidia.com/gpu: "1"
---
# Bandwidth and compute fail differently: a part that computes at full rate but
# reads memory at half rate is usually a link, a seating, or a downgraded
# PCIe/NVLink negotiation, not a bad die. The numbers below are placeholders —
# retune them for your part before gating anything on this.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: memory-bandwidth
spec:
  kind: memory-bw
  scope: Node
  durationSeconds: 180
  # MEASURED on this fleet, not derived. Four samples across both GB10 Sparks,
  # two runs each:
  #
  #   hostToDevice   58.93  59.13  59.16  61.02   GB/s
  #   deviceToHost   59.32  59.33  59.57  60.77   GB/s
  #   deviceToDevice 120.93 121.44 121.83 122.34  GB/s
  #
  # Pinned at ~90% of the fleet median, which leaves comfortable headroom over
  # the observed minimum while still catching a degraded link.
  #
  # These gates were previously 20, which is the failure mode opposite to the
  # one this project kept hitting: not a threshold so tight it fails healthy
  # hardware, but one so loose it ACCEPTS a node running at a third of its
  # expected bandwidth — exactly the fault memory-bw exists to detect. A
  # too-permissive gate is worse than none, because it reports a verdict.
  #
  # Re-measure before reusing these on any other SKU. On GB10 the host and
  # device share one physical memory pool over NVLink-C2C, so these numbers
  # describe unified-memory bandwidth and do not transfer to a discrete part.
  thresholds:
    - metric: hostToDeviceBandwidthGBs
      comparison: GreaterThanOrEqual
      value: "53"
    - metric: deviceToHostBandwidthGBs
      comparison: GreaterThanOrEqual
      value: "53"
    - metric: deviceToDeviceBandwidthGBs
      comparison: GreaterThanOrEqual
      value: "109"
  resources:
    limits:
      # "1" is GB10's own board size — see fp4-compute-smoke above; on a
      # multi-GPU SKU use fingerprint-probe's acceleratorCount instead. No
      # deviceCount gate here: memory-bw's nvbandwidth iterates every VISIBLE
      # device already, but the runner itself does not yet claim deviceCount
      # (runners/devicefold_test.go's PENDING list, tracked by #431) — a
      # deviceCount threshold would fail closed on every run until then.
      nvidia.com/gpu: "1"
---
# Host DIMM faults present as accelerator flakiness: a corrupted staging buffer
# becomes a wrong answer that looks like a bad GPU. Accepting a node means
# accepting its host memory too.
#
# stressapptest (Apache-2.0) is the sanctioned tool. stress-ng, fio and
# memtester are GPL and cannot ship in an image published by this project.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: host-memory-stress
spec:
  kind: memory-stress
  scope: Node
  durationSeconds: 900
  thresholds:
    - metric: memoryErrors
      comparison: Equal
      value: "0"
    - metric: miscompares
      comparison: Equal
      value: "0"
---
# Passive: applies no load and measures no throughput, so it is cheap enough to
# run in every profile. Its value is that these counters move while every
# performance test still passes — a link retraining or a row being remapped is a
# part on its way out.
#
# NOTE on eccErrors and remappedRows: these two gates are RequiredIfMeasurable,
# and the distinction is the reason that value exists.
#
#   - On a GB10 / DGX Spark there is NO ECC to read. The unified LPDDR5X has
#     on-die ECC only, so nvidia-smi returns [N/A] for every ECC and row-remap
#     field on a perfectly healthy part. host-health emits `n/a` for them — it
#     asked, and the hardware said there is nothing to count — and these gates
#     are reported as NOT EVALUATED. The node passes, and the report says which
#     gates did not run and why.
#
#   - On an ECC-capable GPU (H100 and friends) nothing is relaxed. Real counters
#     are reported, so a non-zero count still FAILS, and a GPU whose ECC has
#     been switched off reports no counter at all, which fails closed exactly as
#     it did before — turning ECC off is not a way to pass this gate.
#
# Change these to `Required` (or drop the applicability field, which defaults to
# it) for a fleet where every part has real ECC and a missing reading should
# condemn the node.
#
# NOTE on the /dev/kmsg mount: it is what makes the xidEvents gate below mean
# anything. Xids are read from the kernel ring buffer, which is NOT in a
# container's default /dev — without the mount the runner reports
# `xid_source=none` and OMITS xidEvents entirely, so the gate fails closed and
# the node is condemned for a measurement nobody took. Mounting it is what turns
# that gate from a guaranteed failure into a real question about the hardware.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: host-fault-counters
spec:
  kind: host-health
  scope: Node
  durationSeconds: 30
  hostNetwork: true # NIC link state is read from the host's sysfs
  runner:
    # No image: host-health has a default in internal/controller/pods.go and this
    # test does not want to override it. spec.runner is here only to declare the
    # host access below — which is exactly the review question this field exists
    # to make askable, so it is spelled out rather than assumed.
    #
    # THREE things are needed to read /dev/kmsg, and this sample used to name
    # only two. The mount supplies the device node; `privileged` supplies the
    # capability to the PROCESS; and `runAsUser: 0` is what lets that capability
    # survive into the effective set.
    #
    # The claim that used to be here — "privileged supplies CAP_SYSLOG" — is
    # false for a non-root container, and this file's own sibling
    # (pair-network-acceptance.yaml) already documents the same trap for
    # IPC_LOCK: Linux drops effective capabilities when a process switches away
    # from root, so a privileged pod running as uid 65532 reads CapEff as all
    # zeros. Every runner image this project publishes declares USER 65532.
    #
    # MEASURED, on a healthy GB10 with this sample applied unmodified:
    #
    #     phase: Failed
    #     metric "xidEvents" was not reported by the runner [HOST_HEALTH_OK]
    #
    # The runner said the host was fine and the profile condemned the node,
    # because `xidEvents Equal 0` is Required and a metric the runner never
    # emitted fails closed — correctly. The gate was unsatisfiable on every node
    # in any fleet with kernel.dmesg_restrict=1, which is the default on Ubuntu
    # and most distributions. See issue #134.
    privileged: true
    # Without this the mount above is necessary and not sufficient, and the
    # xidEvents gate below can never be satisfied. If your policy forbids a root
    # runner, drop the xidEvents threshold too — a gate nothing can satisfy is
    # worse than no gate, because it arrives in the shape of a hardware verdict.
    runAsUser: 0
    hostPaths:
      # readOnly is left unset and therefore TRUE. This runner only ever reads
      # the ring buffer; a burn-in runner has no business writing to the kernel
      # log, and the default falls that way so that nobody has to notice.
      - path: /dev/kmsg
        mountPath: /dev/kmsg
        # Assert what it must already be. The operator will never create a path
        # on a node to satisfy its own mount, so a node with no /dev/kmsg refuses
        # the pod and the run records an infrastructure Error — the node is
        # unjudged, which is honest, rather than silently unmeasured.
        type: CharDevice
  thresholds:
    # Producible only because of the /dev/kmsg mount above. Window-scoped: see
    # xidPreexisting in the runner README to hold this boot's earlier history
    # against the node as well.
    - metric: xidEvents
      comparison: Equal
      value: "0"
    - metric: pcieReplayErrors
      comparison: Equal
      value: "0"
    - metric: eccErrors
      comparison: Equal
      value: "0"
      applicability: RequiredIfMeasurable
    - metric: remappedRows
      comparison: Equal
      value: "0"
      applicability: RequiredIfMeasurable
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInProfile
metadata:
  name: node-acceptance
spec:
  # Every result, even after one failure: a full acceptance sweep is evidence
  # about a node, and stopping early throws away the rest of it.
  failFast: false
  tests:
    # Cheapest first: a node whose fault counters are already moving does not
    # need to be soaked for fifteen minutes to be suspect.
    - testRef: host-fault-counters
    - testRef: fp4-compute-smoke
    - testRef: sustained-clock
    - testRef: memory-bandwidth
    - testRef: dcgm-diagnostics
    - testRef: host-memory-stress
  sinks: []
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInRun
metadata:
  name: node-acceptance-example
spec:
  profileRef: node-acceptance
  target:
    nodeNames:
      # Your own node names. A nodeSelector works too and is re-resolved at
      # each run; docs/concepts.md explains how a target list becomes a wave of
      # cordons rather than one cordon of everything.
      - node-a
  # DEFAULT 1, and this is a facility power/cooling interlock rather than a
  # performance knob. Raising it multiplies real electrical load and real heat
  # in a real room. Read the field documentation on BurnInRunSpec first.
  maxConcurrentNodes: 1
  ttlSecondsAfterFinished: 86400
