# One test, many cells: sweeping an axis without authoring the test five times.
#
# ─── WHAT THIS IS FOR ─────────────────────────────────────────────────────────
#
# gemm-sweep runs one GEMM at ONE precision per execution, read from
# BURNIN_VARIANT_PRECISION. A precision is ONE cell of a matrix: the same
# question at FP4, FP8, BF16, TF32 and FP64 answers different things about the
# same silicon — a part that passes FP4 and fails FP64 has a different fault
# than one that fails both — and before variants the only way to ask all five
# was to author five BurnInTest objects differing by one environment variable,
# each with its own name, its own thresholds, and its own copy of every other
# field.
#
# The axis must point at a runner that READS it. compute-smoke deliberately does
# not: it is the fixed FP4 burst gate, and a precision axis on it would label
# cells fp8/bf16/fp64 while every one of them ran FP4 — a sweep certified
# against measurements nobody took.
#
# ─── HOW IT EXPANDS ───────────────────────────────────────────────────────────
#
# Each variant becomes an ordinary execution named "<test>-<variant>", planned
# and reported exactly like a test somebody wrote out by hand. Nothing after
# expansion knows variants exist, which is why a sweep behaves identically to a
# hand-written suite: same result identity, same verdict rules, same delivery.
#
# THE ARITHMETIC IS NOT VISIBLE HERE, so the operator states it. Four variants
# across eight nodes is thirty-two node-executions, and at maxConcurrentNodes 1
# they are sequential. The run's PlanExpanded condition says so at start rather
# than leaving it to be discovered by waiting.
#
# ─── THRESHOLDS REPLACE, THEY DO NOT MERGE ────────────────────────────────────
#
# An FP4 throughput floor is not an edited FP8 floor — they are different numbers
# about different hardware paths. A variant that sets `thresholds` REPLACES the
# parent's list entirely. Merging by metric name would silently retain a gate the
# author believed they had replaced, and a node failed against a threshold nobody
# can find in the profile has a verdict with nothing to read that explains it.
#
#   thresholds: omitted   → inherit the parent's
#   thresholds: []        → apply NONE (a legitimate thing for an explore cell)
#   thresholds: [ ... ]   → these, and only these
#
# ─── THE AXES MEAN NOTHING TO THE OPERATOR ────────────────────────────────────
#
# `axes` are opaque labels. Each becomes BURNIN_VARIANT_<AXIS> in the runner's
# environment, and is echoed onto the result and into the delivery envelope so a
# report can group a sweep's cells. The controller never branches on them:
# interpreting a precision is the runner's job, and a reconciler that learned to
# read `precision: fp4` would be the vendor branch this project refuses, wearing
# a different hat.
#
# ─── THIS SAMPLE IS THRESHOLDLESS ON PURPOSE ──────────────────────────────────
#
# No measured baselines exist yet for these precisions on any SKU in the fleet,
# and this repository has already been bitten once by a threshold derived from a
# spec sheet rather than from hardware. Gather numbers with a baseline run first
# (spec.baseline on the BurnInRun), then pin the floors.
---
# The runner behind the sweep. There is no published gemm-sweep image yet, so
# spec.runner.image is REQUIRED here and this sample names a placeholder:
# publishing is manual and follows verification on real hardware, and without a
# default the run fails at plan time naming the problem rather than
# ImagePullBackOff-ing on every targeted node.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: gemm-sweep
spec:
  kind: gemm-sweep
  # The window each cell runs for: the same GEMM is launched repeatedly and
  # every iteration is checked against the host reference, so the duration buys
  # repeated correctness trials and a stable TFLOP/s figure. It is NOT a
  # thermal soak — thermal-soak and gpu-burn own sustained load.
  durationSeconds: 60
  runner:
    image: ghcr.io/baldwinspc/glimmer-burnin-gemm-sweep:REPLACE-ME
  # No thresholds. Every number in this repo is measured, never taken from a
  # spec sheet; no measured baselines exist yet for these precisions on any SKU
  # in the fleet. When they do, remember thresholds are PER VARIANT: an FP4
  # throughput floor and an FP64 throughput floor are different numbers about
  # different silicon, and a variant that sets `thresholds` REPLACES the
  # parent's list entirely.

---
# Declared HERE rather than referenced from another sample, because a sample
# that cannot be applied on its own is not a worked example. Both profiles below
# referenced BurnInTests that existed only in segmented-soak.yaml and
# pair-network-acceptance.yaml, so `kubectl apply -f variant-sweep.yaml` planned
# nothing at all (#300).
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: thermal-soak
spec:
  kind: thermal-soak
  scope: Node
  # The BASE duration, which every variant below overrides. It is the shortest
  # of them on purpose: an overlay that is never applied should run the cheapest
  # cell rather than the most expensive one.
  durationSeconds: 60
  thresholds:
    # Deliberately none. This entry is `required: false` in the profile and
    # exists to demonstrate the duration axis; a gate here would make the
    # example about thermal acceptance instead, and the numbers that belong in
    # one are per-SKU and measured. See node-acceptance.yaml for a real gate.

---
# The link this sweep measures, declared here for the same reason as above.
#
# Named for the LINK rather than for the tool: a Pair verdict is a statement
# about the path between two nodes, and one TestResult names both of them.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: ib-write-bw-link
spec:
  kind: ib-write-bw
  scope: Pair
  durationSeconds: 60
  runner:
    hostPaths:
      - path: /dev/infiniband
        mountPath: /dev/infiniband
        # WRITABLE, and it has to be said out loud because readOnly defaults to
        # true. ibv_open_device opens the uverbs nodes read-write, so a
        # read-only mount fails in the same place as no mount at all.
        readOnly: false
        # A fabric node with no /dev/infiniband has not loaded its RDMA drivers.
        # That is infrastructure, so refusing the pod (Error — unjudged) is
        # right; the operator will not create the path to paper over it.
        type: Directory
  # No thresholds: every gate in this example lives on a variant, which is the
  # point being demonstrated. A variant's thresholds REPLACE rather than merge,
  # so a base gate here would be silently discarded by the cells below and read
  # as though it applied.

---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInProfile
metadata:
  name: gemm-precision-sweep
spec:
  failFast: false
  tests:
    - testRef: gemm-sweep
      variants:
        # Each cell names itself. The name is result identity, so it is what a
        # verdict, a delivery key and a report all key off — two variants of one
        # test may not share one, and the run refuses at plan time if they do.
        #
        # A precision the part does not have skips cleanly and visibly: the
        # runner declares it with a GEMM_SWEEP_SKIP marker, per cell, so a
        # Hopper fleet running this exact profile records fp4 as out of scope
        # rather than failed.
        - name: fp4
          axes: {precision: fp4}
        - name: fp8
          axes: {precision: fp8}
        - name: bf16
          axes: {precision: bf16}
        - name: tf32
          axes: {precision: tf32}
        - name: fp64
          axes: {precision: fp64}
          # FP64 on a consumer-class part is a fraction of the FP32 rate, so
          # this cell is given longer. An overlay REPLACES the parent's value;
          # every other field is inherited.
          durationSeconds: 300

    # An axis does not have to be a precision. Anything a runner reads is fair
    # game — message size for a fabric test, buffer size for a bandwidth test,
    # a duration class for a soak.
    #
    # Duration classes are a convention rather than an API enum, matching the
    # open-world precedent TestKind already sets: the axis carries the name and
    # the overlay carries the number.
    - testRef: thermal-soak
      required: false
      variants:
        - name: smoke
          axes: {class: smoke}
          durationSeconds: 60
        - name: standard
          axes: {class: standard}
          durationSeconds: 1800

---
# The fabric equivalent: bandwidth and latency are two properties of one link,
# and only one of them predicts collective performance.
#
# ib-write-bw already measures both — ib_write_bw and ib_write_lat both ship in
# the image — but before variants, latency was a number that came along with a
# bandwidth test and could not carry thresholds of its own. As a variant it can.
#
# A latency-only cell emits NO bandwidth metrics. That is deliberate: reporting
# bw_average=0 from a phase that never ran would be a fabricated measurement, and
# a bandwidth threshold would fail the link on a number nobody took. Omitting it
# means such a gate fails closed instead, which is the honest outcome — the gate
# was written for a measurand this execution did not measure.
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInProfile
metadata:
  name: fabric-both-properties
spec:
  failFast: false
  tests:
    - testRef: ib-write-bw-link
      variants:
        - name: bandwidth
          axes: {measurand: bandwidth}
          thresholds:
            # Measured on this project's own RoCE fabric, which sustains about
            # 100 Gb/s rather than its 200G line rate. A floor taken from the
            # line rate would fail every healthy link in the fleet.
            - metric: bandwidthGbps
              comparison: GreaterThanOrEqual
              value: "90"

        - name: latency
          axes: {measurand: latency}
          # The whole window goes to latency: with no bandwidth phase there is
          # nothing to carve a budget out of.
          durationSeconds: 120
          thresholds:
            # THE TAIL IS THE FINDING. A collective runs at the speed of its
            # slowest participant on every iteration, so a link with a healthy
            # mean and a p99 an order of magnitude worse degrades every
            # collective on the fleet while passing a bandwidth gate outright.
            - metric: p99LatencyUs
              comparison: LessThanOrEqual
              value: "25"
            - metric: latencyUs
              comparison: LessThanOrEqual
              value: "10"
