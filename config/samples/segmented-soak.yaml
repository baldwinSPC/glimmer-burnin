# A week-long soak that survives the week.
#
# Without spec.soak, `durationSeconds: 604800` is ONE POD with an
# activeDeadlineSeconds of 604920. Everything that normally happens to a pod over
# a week is fatal to it — a kubelet restart, a drain, an eviction, an image-GC
# pass, a reboot — and with retryOnErrorLimit set the retry starts the week over
# from zero.
#
# Segmenting makes each of those cost fifteen minutes. Every segment is its own
# pod, sized to the segment; the verdict is still rendered ONCE, over the
# aggregate of the clean segments.
#
# See docs/soaks.md for the capacity arithmetic before applying this: it holds
# one node out of the fleet for seven days.

apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInTest
metadata:
  name: week-long-thermal-soak
spec:
  kind: thermal-soak
  scope: Node
  durationSeconds: 604800 # seven days
  runner:
    # The Xid watch's grant — all three parts, and they only mean anything
    # together (see runners/thermal-soak/README.md, "The Xid watch", and the
    # measured three-way trap in runners/host-health/README.md, issue #134):
    # the mount supplies the device node, privileged supplies the
    # device-cgroup grant, and runAsUser: 0 is what lets a capability survive
    # into the effective set. Drop all three and the soak still runs — it
    # reports xid_source=none and OMITS xid_count — but then the xidEvents
    # gate below must be dropped with them, because a gate on a metric the
    # runner cannot produce fails every node in the shape of a hardware
    # verdict.
    privileged: true
    runAsUser: 0
    hostPaths:
      - path: /dev/kmsg
        mountPath: /dev/kmsg
        # readOnly defaults to true. Asserting CharDevice means the kubelet
        # refuses the pod on a node with no /dev/kmsg rather than creating
        # anything — an infrastructure Error, the node unjudged, which is
        # honest.
        type: CharDevice
  soak:
    # One pod's window. The floor is 300: below five minutes the run spends more
    # time changing pods than measuring hardware. This soak is 672 segments.
    segmentSeconds: 900
    # Left at its default of false. Turning it on ends the soak the moment the
    # aggregate PROVABLY violates a gate — meaning no later segment could retract
    # it. Two of the three gates below qualify: sustainedClockPct is a Min under
    # a floor and a minimum only falls, and gpuTempC is a Max under a ceiling and
    # a maximum only rises. elapsedS does NOT: it is a Sum under a floor, and a
    # sum only grows, so that gate can only become satisfied and never provably
    # broken. Read the abortEarly section of docs/soaks.md before setting it.
    abortEarly: false
  # Mid-flight evidence, so a soak that is lost at hour eighty still says what
  # the temperatures were doing. A checkpoint is EVIDENCE and never a verdict:
  # no threshold is applied to one, and abortEarly does not read one either.
  checkpointIntervalSeconds: 900
  thresholds:
    # elapsedS SUMS across segments, which is what makes this an honest gate on
    # whether the soak actually soaked rather than on what it was asked to do.
    # 0.95 x 604800 leaves room for the segment boundaries themselves.
    - metric: elapsedS
      comparison: GreaterThanOrEqual
      value: "574560"
    # "Zero Xids DURING seven days of load" — the criterion every operator
    # write-up states and this operator could not express until thermal-soak
    # grew its own /dev/kmsg watch. The gate is only satisfiable because of
    # the spec.runner grant above: an EARLIER revision of this sample carried a
    # long comment here explaining that thermal-soak "never emits xidEvents"
    # and that gating it would fail every healthy node — true then, and the
    # trap it described is still armed if the grant above is removed while
    # this gate stays.
    #
    # WINDOW-SCOPED, and Sum across segments: each segment's pod counts only
    # what arrived while IT was loading the part (the watch positions at the
    # ring buffer's tail at segment start), and foldMetrics sums the segments
    # — so this value is "Xids during the whole soak's own load", never "Xids
    # since boot". host-health's xidPreexisting is the gate for held-over
    # history, and a host-health test after this one still corroborates the
    # whole node.
    - metric: xidEvents
      comparison: Equal
      value: "0"
    # A ceiling on a Max-aggregated metric: the peak across the WHOLE soak, not
    # the peak of the last window.
    - metric: gpuTempC
      comparison: LessThanOrEqual
      value: "87"
    # A floor on a Min-aggregated metric: the WORST window is the verdict. A part
    # that held 83% for six days and 40% for one is a part that dropped to 40%.
    - metric: sustainedClockPct
      comparison: GreaterThanOrEqual
      value: "60"
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInProfile
metadata:
  name: week-long-soak
spec:
  failFast: false
  tests:
    - testRef: week-long-thermal-soak
  sinks:
    - soak-results
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInRun
metadata:
  name: week-long-soak
spec:
  profileRef: week-long-soak
  target:
    nodeNames:
      - node-a
  # The facility interlock. One node at full power for seven days.
  maxConcurrentNodes: 1
  # Retries apply to the Error phase ONLY, and on a segmented soak an Error
  # re-runs THE SEGMENT that errored — not the week. That is what makes a
  # non-trivial budget reasonable here; on an unsegmented soak each retry would
  # buy another seven days.
  retryOnErrorLimit: 3
  # The outer bound, and it has to leave room for the retries above plus the
  # per-segment scheduling round-trips: eight days for a seven-day soak.
  deadlineSeconds: 691200
---
apiVersion: burnin.glimmer.ai/v1alpha1
kind: BurnInSink
metadata:
  name: soak-results
spec:
  type: ConfigMap
  configMap:
    name: burnin-results
