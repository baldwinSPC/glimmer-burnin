{{- if .Values.rbac.create }}
{{/*
The ClusterRole is generated from kubebuilder markers by `make manifests` and is
kept in step with config/rbac/role.yaml by hack/chart. It is cluster-scoped
because the operator cordons Nodes, which are cluster-scoped objects, and reads
pod logs across namespaces.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}-manager
  labels: {{- include "glimmer-burnin.labels" . | nindent 4 }}
rules:
{{ .Files.Get "rbac/role-rules.yaml" | indent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}-manager
  labels: {{- include "glimmer-burnin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "glimmer-burnin.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "glimmer-burnin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
Leader election is namespaced, and deliberately so: the Lease lives in the
operator's OWN namespace, which is why the manager is told that namespace
explicitly rather than guessing. Electing in another namespace fails as a
permission error that reads like a bug.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "glimmer-burnin.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "glimmer-burnin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "glimmer-burnin.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "glimmer-burnin.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
