apiVersion: v2
name: glimmer-burnin
description: >-
  Vendor-neutral, Kubernetes-native hardware acceptance testing (burn-in) for
  accelerator fleets. Runs acceptance tests against nodes, evaluates the results
  against declared thresholds, and exports verdicts.
type: application

# The chart version and the app version move together on purpose. A runner image
# is executed by a node's readiness gate and published tags are immutable, so
# "which chart" and "which operator" must not be two questions.
version: 0.6.2
appVersion: "0.6.2"

home: https://github.com/baldwinSPC/glimmer-burnin
sources:
  - https://github.com/baldwinSPC/glimmer-burnin
keywords:
  - burn-in
  - gpu
  - accelerator
  - hardware-testing
  - acceptance
  - sre
maintainers:
  - name: baldwinSPC
    url: https://github.com/baldwinSPC
annotations:
  # No webhooks, therefore no cert-manager. That is a real adoption advantage
  # and is worth stating where somebody evaluating the chart will see it.
  artifacthub.io/prerelease: "false"
