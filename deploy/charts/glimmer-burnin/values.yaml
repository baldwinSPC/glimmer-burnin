# Defaults are EDGE-FRIENDLY: a single replica, small requests, and tolerations
# that let the manager schedule on the kind of small cluster this operator is
# most often pointed at first.

image:
  repository: ghcr.io/baldwinspc/glimmer-burnin
  # Empty means the chart's appVersion, so "which chart" and "which operator"
  # stay one question. Pin it explicitly to run a different build.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# replicaCount is 1 deliberately, and leaderElection stays on with it.
#
# One replica plus leader election is not redundancy — it is what makes a
# ROLLING UPDATE safe. The shipped Deployment's maxSurge starts the second
# manager before the first is gone, and the lease is what stops them both
# reconciling the same run. Turning leader election off with replicas: 1 would
# make every upgrade a window where two managers race.
replicaCount: 1
leaderElection: true

# The operator has NO WEBHOOKS, so there is no cert-manager dependency. Keep it
# that way: it is one of the few things that makes this cheap to adopt.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # The ClusterRole this operator needs is generated from kubebuilder markers
  # and shipped in the chart. Set create: false only if you manage an equivalent
  # role yourself — the operator cannot run without one, and a narrower role
  # fails at runtime as permission errors that read like bugs.
  create: true

# Tolerations that matter, and why.
#
# This operator CORDONS the nodes it tests. On a small cluster the manager may
# well be scheduled on one of them, and without the unschedulable toleration it
# becomes unschedulable exactly when it is needed. The control-plane toleration
# covers the two-node cluster where both nodes are control-plane, which is the
# common first deployment.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/unschedulable
    operator: Exists
    effect: NoSchedule

nodeSelector: {}
affinity: {}
podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# No CPU limit, deliberately. The manager is bursty at run start — resolving a
# profile, building a plan, capturing fingerprints — and CFS throttling there
# delays cordons and pod creation on hardware the run is already holding.

metrics:
  enabled: true
  port: 8080
  service:
    type: ClusterIP
    annotations: {}
  # A ServiceMonitor needs the Prometheus Operator's CRD. Off by default so the
  # chart installs on a cluster that does not have it.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

health:
  port: 8081

# Extra args appended to the manager. --cluster-name is the common one: it names
# the fleet in every delivered envelope, so a consumer aggregating several
# clusters can tell them apart.
extraArgs: []
