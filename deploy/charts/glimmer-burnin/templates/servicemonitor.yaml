{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{/*
Behind a flag because it needs the Prometheus Operator's CRD, and the chart must
install on a cluster that does not have it. Enabling this without that CRD fails
the release, which is the honest outcome — a silently skipped ServiceMonitor
would leave somebody believing they are scraping when they are not.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glimmer-burnin.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "glimmer-burnin.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
