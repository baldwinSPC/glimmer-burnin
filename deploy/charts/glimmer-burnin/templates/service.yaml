{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glimmer-burnin.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "glimmer-burnin.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metrics.service.type }}
  selector: {{- include "glimmer-burnin.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
